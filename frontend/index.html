    <script>
      // Pre-paint theme: read the persisted preference and class <html> before
      // first paint, so light/system users never see a dark flash (and AMOLED
      // users never see a grey one). Mirrors src/utils/theme.ts — keep in sync.
      (function () {
        // Boot transition guard (4.17.0): CSS transitions that fire while the
        // app hydrates (theme class application, focus styles) register as
        // main-thread animations and waste frames. Suppress transitions until
        // the first painted frame — main.tsx lifts the class via double-rAF.
        document.documentElement.classList.add('boot-still');
        try {
          var raw = localStorage.getItem('vinax.settings.v1');
          var st = (raw && JSON.parse(raw).state) || {};
          var pref = st.theme || 'dark';
          // Accent before first paint too — else picked accents flash indigo.
          if (st.accent && st.accent !== 'crimson') document.documentElement.setAttribute('data-accent', st.accent);
          // v5.17.0 — display size + high contrast before first paint (custom
          // accent ramps are applied by the app a frame later).
          if (st.uiScale === 'sm') document.documentElement.style.fontSize = '15px';
          else if (st.uiScale === 'lg') document.documentElement.style.fontSize = '17.5px';
          if (st.highContrast) document.documentElement.classList.add('hc');
          // Adjustable glass before first paint (mirrors src/utils/theme.ts).
          var gl = typeof st.glassLevel === 'number' ? Math.min(100, Math.max(0, st.glassLevel)) : 40;
          document.documentElement.style.setProperty('--glass-alpha', String(1 - 0.55 * (gl / 100)));
          var gb = typeof st.glassBlur === 'number' ? Math.min(100, Math.max(0, st.glassBlur)) : 40;
          document.documentElement.style.setProperty('--glass-blur-boost', String(gb / 100));
          var hr = new Date().getHours();
          var dark = pref === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : pref === 'auto' ? !(hr >= 7 && hr < 19) : pref !== 'light';
          var cls = document.documentElement.classList;
          cls.toggle('light', !dark);
          cls.toggle('dark', dark);
          cls.toggle('amoled', pref === 'amoled');
          // 11.0 — the app style before first paint (mirrors TEMPLATE_CANVAS in
          // src/utils/theme.ts: [dark, light] page canvas per style).
          var TC = { vinax: ['#130e16', '#faf5ed'] };
          // 2.0 — one look: every style id an earlier release stored opens in it.
          var tpl = TC.hasOwnProperty(st.template) ? st.template : 'vinax';
          document.documentElement.setAttribute('data-template', tpl);
          var bg = pref === 'amoled' ? '#000000' : TC[tpl][dark ? 0 : 1];
          document.documentElement.style.background = bg;
          document.documentElement.style.setProperty('--boot-bg', bg);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', bg);
        } catch (e) { /* keep the static dark default */ }
        if (!document.documentElement.getAttribute('data-template')) document.documentElement.setAttribute('data-template', 'vinax');
      })();
    </script>
    <script>
      // First-shelf prefetch (4.18.2): the home page's trending query used to
      // wait for the full chain HTML -> JS download -> React mount -> hook ->
      // fetch. This kicks the SAME request off while the JS is still
      // downloading and parks the parsed-JSON promise on window.__vxBoot;
      // the API client consumes it by exact URL match (services/api/client.ts,
      // single use) and falls back to a normal fetch on any miss or failure.
      // KEEP IN SYNC with trendingSeed() ('top {lang} songs {year}') and
      // searchSongs()'s first path dialect (/search/songs?query=&limit=20) —
      // a drift is harmless (prefetch simply goes unused) but wastes a request.
      (function () {
        try {
          if (location.pathname !== '/') return; // only the home route uses it
          var signedIn = false;
          try { signedIn = !!localStorage.getItem('vinax.account.v1'); } catch (e) { return; }
          var raw = null;
          try { raw = localStorage.getItem('vinax.settings.v1'); } catch (e) { /* private mode */ }
          var st = {};
          try { st = (raw && JSON.parse(raw).state) || {}; } catch (e) { /* corrupt */ }
          var url;
          if (signedIn) {
            var lang = (st.pinnedLanguages && st.pinnedLanguages[0]) || 'hindi';
            var q = 'top ' + lang + ' songs ' + new Date().getFullYear();
            // 14.0.4 — the first ranked base is the app's own catalogue route
            // (the providers live in a Worker secret); the client matches it
            // by URL with the origin normalised away (services/api/client.ts).
            url = location.origin + '/api/cat/search/songs?query=' + encodeURIComponent(q) + '&limit=20';
          } else {
            // 1.12 — signed out, Home's first shelf is "Trending now" from the
            // trending feed (features/home/useHomeShelves useTrendingNow →
            // trendingBundle → getTrending): the same languages (pinned, else
            // hindi as that hook falls back to; known to the feed, at most
            // three) and limit 20. The region's languages arrive later and
            // refetch, but this answer paints the first shelf.
            // KEEP IN SYNC with useTrendingNow and languageParam() in
            // services/api/catalog.ts.
            var KNOWN = ['hindi', 'english', 'punjabi', 'tamil', 'telugu', 'marathi', 'gujarati', 'bengali', 'kannada', 'bhojpuri', 'malayalam', 'urdu', 'haryanvi', 'rajasthani', 'odia', 'assamese'];
            var pinned = (st.pinnedLanguages && st.pinnedLanguages.length ? st.pinnedLanguages : ['hindi']).slice(0, 3);
            var langs = [];
            for (var li = 0; li < pinned.length; li++) { var l = String(pinned[li]).trim().toLowerCase(); if (KNOWN.indexOf(l) !== -1 && langs.indexOf(l) === -1) langs.push(l); }
            if (!langs.length) return;
            url = location.origin + '/api/cat/trending?language=' + encodeURIComponent(langs.slice(0, 3).join(',')) + '&limit=20';
          }
          var json = fetch(url, { headers: { Accept: 'application/json' } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
          window.__vxBoot = { url: url, json: json };
          // 1.12 — the first shelf's artwork starts downloading the moment the
          // answer lands, before the app has mounted: a preload for each of
          // the first tiles, at the size the card will ask for (the same
          // rule as MediaCard's srcset/sizes: a 144 px cell below 640 px,
          // 160 px above, times the pixel ratio, rounded up to the catalogue's
          // 150/250/350/500 variants). The first one is the likely largest
          // paint, so it goes out with high priority.
          json.then(function (d) {
            try {
              var data = d && (d.data || d);
              var songs = data && (data.songs || data.results || data.data);
              if (!songs || !songs.length) return;
              var cell = window.innerWidth >= 640 ? 160 : 144;
              var need = cell * (window.devicePixelRatio || 1);
              var sizes = [150, 250, 350, 500], px = 500;
              for (var si = 0; si < sizes.length; si++) { if (sizes[si] >= need) { px = sizes[si]; break; } }
              var count = window.innerWidth >= 640 ? 5 : 3;
              for (var i = 0, added = 0; i < songs.length && added < count; i++) {
                var imgs = songs[i] && (songs[i].image || songs[i].images);
                var src = null;
                if (Array.isArray(imgs)) { for (var k = 0; k < imgs.length; k++) { var u = imgs[k] && imgs[k].url; if (typeof u === 'string' && u.indexOf('500x500') !== -1) { src = u.replace(/500x500/g, px + 'x' + px); break; } } }
                else if (typeof imgs === 'string' && imgs.indexOf('500x500') !== -1) src = imgs.replace(/500x500/g, px + 'x' + px);
                if (!src || src.indexOf('https://') !== 0) continue;
                var link = document.createElement('link');
                link.rel = 'preload'; link.as = 'image'; link.href = src;
                if (added === 0) link.setAttribute('fetchpriority', 'high');
                document.head.appendChild(link);
                added++;
              }
            } catch (e) { /* decoration only */ }
          }).catch(function () {});
        } catch (e) { /* never block boot */ }
      })();
    </script>
