    <script>
      // Pre-paint theme: read the persisted preference and class <html> before
      // first paint, so light/system users never see a dark flash (and AMOLED
      // users never see a grey one). Mirrors src/utils/theme.ts — keep in sync.
      (function () {
        // Boot transition guard (4.17.0): CSS transitions that fire while the
        // app hydrates (theme class application, focus styles) register as
        // main-thread animations and waste frames. Suppress transitions until
        // the first painted frame — main.tsx lifts the class via double-rAF.
        document.documentElement.classList.add('boot-still');
        // Festival skins from the very first paint — same fest-<id> classes
        // FestiveSplash keeps applied after hydrate. Windows start one day
        // BEFORE the festival (theme-ahead) and are encoded m*100+d.
        // KEEP IN SYNC with src/constants/festivals.ts.
        var fd = new Date(), fv = (fd.getMonth() + 1) * 100 + fd.getDate();
        var FW = [[112, 116, 'sankranti'], [124, 126, 'republic'], [213, 215, 'shivaratri'], [302, 304, 'holi'],
          [317, 319, 'ugadi'], [319, 321, 'eid'], [325, 327, 'ramanavami'], [402, 405, 'easter'],
          [511, 513, 'hanuman'], [711, 726, 'bonalu'], [813, 815, 'ind'], [820, 821, 'varalakshmi'],
          [824, 827, 'onam'], [902, 904, 'janmashtami'], [912, 915, 'ganesh'], [1009, 1018, 'bathukamma'],
          [1018, 1020, 'dussehra'], [1106, 1109, 'diwali'], [1112, 1114, 'nagula'], [1218, 1220, 'vaikunta'],
          [1223, 1225, 'christmas'], [1230, 1231, 'newyear'], [101, 101, 'newyear']];
        for (var fi = 0; fi < FW.length; fi++)
          if (fv >= FW[fi][0] && fv <= FW[fi][1]) { document.documentElement.classList.add('fest-' + FW[fi][2]); break; }
        try {
          var raw = localStorage.getItem('vinax.settings.v1');
          var st = (raw && JSON.parse(raw).state) || {};
          var pref = st.theme || 'dark';
          // Accent before first paint too — else picked accents flash indigo.
          if (st.accent && st.accent !== 'crimson') document.documentElement.setAttribute('data-accent', st.accent);
          // Adjustable glass before first paint (mirrors src/utils/theme.ts).
          var gl = typeof st.glassLevel === 'number' ? Math.min(100, Math.max(0, st.glassLevel)) : 40;
          document.documentElement.style.setProperty('--glass-alpha', String(1 - 0.55 * (gl / 100)));
          var gb = typeof st.glassBlur === 'number' ? Math.min(100, Math.max(0, st.glassBlur)) : 40;
          document.documentElement.style.setProperty('--glass-blur-boost', String(gb / 100));
          var dark = pref === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : pref !== 'light';
          var cls = document.documentElement.classList;
          cls.toggle('light', !dark);
          cls.toggle('dark', dark);
          cls.toggle('amoled', pref === 'amoled');
          var bg = pref === 'amoled' ? '#000000' : dark ? '#0b0c18' : '#f0f2f7';
          document.documentElement.style.background = bg;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', bg);
        } catch (e) { /* keep the static dark default */ }
      })();
    </script>
    <script>
      // First-shelf prefetch (4.18.2): the home page's trending query used to
      // wait for the full chain HTML -> JS download -> React mount -> hook ->
      // fetch. This kicks the SAME request off while the JS is still
      // downloading and parks the parsed-JSON promise on window.__vxBoot;
      // the API client consumes it by exact URL match (services/api/client.ts,
      // single use) and falls back to a normal fetch on any miss or failure.
      // KEEP IN SYNC with trendingSeed() ('top {lang} songs {year}') and
      // searchSongs()'s first path dialect (/search/songs?query=&limit=20) —
      // a drift is harmless (prefetch simply goes unused) but wastes a request.
      (function () {
        try {
          if (location.pathname !== '/') return; // only the home route uses it
          var raw = null;
          try { raw = localStorage.getItem('vinax.settings.v1'); } catch (e) { /* private mode */ }
          var st = {};
          try { st = (raw && JSON.parse(raw).state) || {}; } catch (e) { /* corrupt */ }
          var lang = (st.pinnedLanguages && st.pinnedLanguages[0]) || 'hindi';
          var q = 'top ' + lang + ' songs ' + new Date().getFullYear();
          // v5.6.7 — the prefetch must hit the FIRST ranked base so the
          // orchestrator consumes it by exact URL match: the VinaX Saavn API.
          var url = 'https://vinax-saavan-api.onrender.com/api/search/songs?query=' + encodeURIComponent(q) + '&limit=20';
          window.__vxBoot = {
            url: url,
            json: fetch(url, { headers: { Accept: 'application/json' } })
              .then(function (r) { return r.ok ? r.json() : null; })
              .catch(function () { return null; }),
          };
        } catch (e) { /* never block boot */ }
      })();
    </script>

    <script>
      // Boot self-healing (v4.13.2): if the entry chunk fails to load (mid-
      // deploy edge skew, flaky network, or \u2014 the outage this now recovers
      // from \u2014 a stale SW serving cached HTML whose asset chunks the origin
      // has already rotated away), retry up to 2 times. After that, PANIC:
      // unregister every service worker + purge every cache and reload once
      // more, bypassing the poisoned shell. Only then, if the fresh load
      // still fails, do we surface the honest "check your connection"
      // message \u2014 because at that point it really is the network.
      (function () {
        var KEY = 'vinax.bootRetry';
        var PANIC = 'vinax.bootPanicked';
        var n = 0;
        try { n = Number(sessionStorage.getItem(KEY) || 0); } catch (e) { n = 0; }
        var panicked = false;
        try { panicked = sessionStorage.getItem(PANIC) === '1'; } catch (e) { /* ignore */ }
        function nukeAndReload() {
          try { sessionStorage.setItem(PANIC, '1'); } catch (e) { /* proceed anyway */ }
          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {}));
            }
          } catch (e) { /* ignore */ }
          try {
            if (typeof caches !== 'undefined' && caches.keys) {
              jobs.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {}));
            }
          } catch (e) { /* ignore */ }
          Promise.all(jobs).catch(function () {}).then(function () {
            location.replace(location.pathname + '?bust=' + Date.now());
          });
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || t.tagName !== 'SCRIPT' || !t.src || t.src.indexOf('/assets/') === -1) return;
          var bs = document.querySelector('#boot .bs');
          if (n >= 2 && !panicked) {
            if (bs) bs.textContent = 'Refreshing app\u2026';
            nukeAndReload();
            return;
          }
          if (n >= 3) {
            if (bs) bs.textContent = 'Having trouble loading \u2014 please check your connection and refresh.';
            return;
          }
          try { sessionStorage.setItem(KEY, String(n + 1)); } catch (e2) { /* retry anyway */ }
          if (bs) bs.textContent = 'Updating\u2026';
          setTimeout(function () { location.reload(); }, 600 + n * 2000);
        }, true);
        // Hang watchdog (4.18.4, 2026-08-17 stuck-shell incident): a poisoned
        // service worker or half-evicted cache can leave the entry request
        // HANGING rather than failing \u2014 no error event ever fires, the error
        // ladder above never runs, and the shell sits forever (observed on
        // both web and the Android shell while the origin was verified
        // healthy). If React has not replaced the boot row within 15 seconds,
        // run the same recovery: one panic (unregister SWs + purge caches +
        // reload \u2014 PANIC persists in sessionStorage so this cannot loop),
        // then the honest connection message. main.tsx clears the flags on
        // every successful boot, and a mounted app removes #boot, making the
        // watchdog a no-op on healthy loads.
        setTimeout(function () {
          if (!document.getElementById('boot')) return; // app mounted
          var bs = document.querySelector('#boot .bs');
          if (!panicked) {
            if (bs) bs.textContent = 'Refreshing app\u2026';
            nukeAndReload();
          } else if (bs) {
            bs.textContent = 'Having trouble loading \u2014 please check your connection and refresh.';
          }
        }, 15000);
      })();
    </script>
