<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>VinaX Status</title>
    <link rel="icon" href="/icons/icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff; --fg: #1a1a1f; --muted: #6b6b7a; --card: #ffffff; --line: #e6e7ee;
        --ok: #3ba55d; --okbar: #40b869; --warn: #e6a23c; --bad: #e05252; --none: #d9dbe4;
        --banner-ok: #85b544; --banner-bad: #e05252; --banner-unknown: #8a8a99;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0c12; --fg: #ecebf4; --muted: #9a9aa8; --card: #12131c; --line: #23242f; --none: #2c2d3a; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
      .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 60px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 34px; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      .brand img { width: 34px; height: 34px; border-radius: 9px; }
      .brand span small { font-weight: 600; color: var(--muted); font-size: 15px; margin-left: 6px; }
      .backlink { display: inline-block; padding: 10px 18px; border-radius: 10px; background: #1a1a1f; color: #fff; font-size: 13px; font-weight: 700; text-decoration: none; letter-spacing: 0.04em; }
      @media (prefers-color-scheme: dark) { .backlink { background: #ecebf4; color: #0b0c12; } }
      #banner { border-radius: 8px; padding: 18px 22px; color: #fff; font-size: 19px; font-weight: 700; margin-bottom: 36px; background: var(--banner-unknown); }
      #banner.ok { background: var(--banner-ok); }
      #banner.bad { background: var(--banner-bad); }
      .meta-line { text-align: right; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
      .meta-line b { color: var(--fg); font-weight: 600; }
      .board { border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
      .comp { padding: 18px 22px 20px; }
      .comp + .comp { border-top: 1px solid var(--line); }
      .comp .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
      .comp .head .name { font-size: 15.5px; font-weight: 700; }
      .comp .head .state { font-size: 13.5px; font-weight: 600; }
      .state.up { color: var(--ok); } .state.down { color: var(--bad); } .state.unknown { color: var(--muted); }
      .bars { display: flex; gap: 3px; height: 34px; align-items: stretch; }
      .bars i { flex: 1; border-radius: 2px; background: var(--none); min-width: 2px; position: relative; }
      .bars i.g { background: var(--okbar); } .bars i.w { background: var(--warn); } .bars i.r { background: var(--bad); }
      .bars i:hover::after {
        content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
        background: var(--fg); color: var(--bg); font-size: 11.5px; padding: 6px 10px; border-radius: 8px; white-space: pre;
        z-index: 5; pointer-events: none; box-shadow: 0 8px 22px rgb(0 0 0 / 0.25);
      }
      .legend { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin-top: 8px; gap: 8px; }
      .legend .pct { font-variant-numeric: tabular-nums; }
      .legend .rule { flex: 1; border-top: 1px solid var(--line); margin: 0 6px; }
      footer { margin-top: 30px; color: var(--muted); font-size: 12.5px; text-align: center; line-height: 1.7; }
      footer a { color: inherit; }
      #err { display: none; margin-top: 20px; color: var(--bad); font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand"><img src="/icons/icon.svg" alt="" /><span>VinaX <small>Status</small></span></div>
        <a class="backlink" href="https://www.sirimillavinay.online/">OPEN VINAX</a>
      </header>
      <div id="banner">Checking status…</div>
      <div id="note" style="display:none; border-radius: 8px; padding: 14px 20px; margin: -22px 0 36px; font-size: 14.5px; line-height: 1.55; background: rgb(230 162 60 / 0.14); border: 1px solid rgb(230 162 60 / 0.45); color: var(--fg);"></div>
      <div class="meta-line">Uptime over the past <b id="window">90</b> days · checks run every 30 minutes · times in UTC</div>
      <div id="board" class="board"></div>
      <p id="err">Could not load status data — please refresh in a moment.</p>
      <footer>
        Independent probes measured from the edge, recorded every 30 minutes.<br />
        <a href="https://www.sirimillavinay.online/">www.sirimillavinay.online</a> · auto-refreshes every minute
      </footer>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
