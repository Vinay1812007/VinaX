<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Audit finding H-SRV-10: strict CSP for the admin console. Blocks
         inline scripts and any script host except our own, so a stray
         unescaped-innerHTML slip can't execute injected <script>. Styles keep
         'unsafe-inline' because the file uses a large embedded <style> block
         (removing that would need a bigger refactor). connect-src is set to
         'self' + Supabase for direct client hits (currently unused by this
         console, kept as a hedge for future direct queries). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://nominatim.openstreetmap.org" />
    <title>VinaX Admin</title>
    <!-- Leaflet (vendored — CSP script-src is 'self') for the World map. -->
    <link rel="stylesheet" href="/admin/leaflet/leaflet.css" />
    <style>
      /* =====================================================================
         VinaX Admin Console — v5.8.0 formal redesign.
         One token system drives everything: flat surfaces, hairline borders,
         a strict 4/8px rhythm, one accent, restrained type. No blur, no glow,
         no gradients. body.lightadm only re-maps the tokens.
         ===================================================================== */
      :root {
        color-scheme: dark;
        --bg: #0b0d12;            /* page */
        --surface: #12151c;       /* cards, nav, header */
        --surface-2: #181c25;     /* hover rows, table heads, inputs */
        --surface-3: #1f2430;     /* pressed / active fills */
        --border: #232936;
        --border-strong: #303747;
        --text: #e6e9ef;
        --text-2: #a4acba;
        --text-3: #6f7788;
        --accent: #4f8cff;
        --accent-strong: #3b78f0;
        --accent-soft: rgba(79, 140, 255, 0.14);
        --accent-text: #8fb5ff;
        --ok: #2fbf71;
        --warn: #e0a326;
        --danger: #e5484d;
        --ok-soft: rgba(47, 191, 113, 0.14);
        --warn-soft: rgba(224, 163, 38, 0.14);
        --danger-soft: rgba(229, 72, 77, 0.14);
        --r-sm: 6px; --r: 8px; --r-lg: 10px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);
        --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        /* Legacy aliases still referenced by app.js inline styles. */
        --ember: var(--accent);
        --pink: var(--accent);
        --grad: var(--accent);
      }
      body.lightadm {
        color-scheme: light;
        --bg: #f4f5f8;
        --surface: #ffffff;
        --surface-2: #f2f4f8;
        --surface-3: #e8ebf1;
        --border: #dfe3ea;
        --border-strong: #c9cfd9;
        --text: #171a21;
        --text-2: #4c5563;
        --text-3: #7a8494;
        --accent: #2f6fed;
        --accent-strong: #245fd6;
        --accent-soft: rgba(47, 111, 237, 0.10);
        --accent-text: #2158c4;
        --ok: #1f9d5a;
        --warn: #b7791f;
        --danger: #d03a40;
        --shadow: 0 1px 2px rgba(20, 30, 60, 0.08);
        --shadow-lg: 0 16px 40px rgba(20, 30, 60, 0.18);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body {
        margin: 0; font-family: var(--font); font-size: 13px; line-height: 1.45; color: var(--text); background: var(--bg);
        -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      }
      a { color: var(--accent-text); }
      code { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
      ::selection { background: var(--accent-soft); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* ---------- Controls ---------- */
      input[type="password"], input[type="text"], input[type="search"], input[type="date"], input[type="number"], input[type="url"], input[type="email"],
      select, textarea, .inp {
        width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
        font-size: 13px; font-family: inherit; line-height: 1.4; transition: border-color .12s ease, box-shadow .12s ease;
      }
      select, select.inp, input[type="date"], input[type="date"].inp, input[type="color"] { width: auto; }
      input::placeholder, textarea::placeholder { color: var(--text-3); }
      input:focus, select:focus, textarea:focus, .inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' width='10' height='7'><path fill='%237a8494' d='M6 8L0 0h12z'/></svg>");
        background-repeat: no-repeat; background-position: right 10px center; }
      button {
        padding: 7px 12px; border-radius: var(--r-sm); border: 1px solid transparent; cursor: pointer; background: var(--accent); color: #fff;
        font-weight: 600; font-size: 12.5px; font-family: inherit; line-height: 1.3;
        transition: background .12s ease, border-color .12s ease, color .12s ease, box-shadow .12s ease;
      }
      button:not(:disabled):hover { background: var(--accent-strong); }
      button:not(:disabled):active { box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25); }
      button:disabled { opacity: .45; cursor: not-allowed; }
      button.ghost { background: var(--surface); border-color: var(--border-strong); color: var(--text-2); font-weight: 500; }
      button.ghost:not(:disabled):hover { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); }
      button.icon-btn { width: 30px; height: 30px; min-height: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-sm); font-size: 11px; line-height: 1; }
      button.icon-btn:disabled { opacity: .25; }
      .err { color: var(--danger); font-size: 12.5px; margin-top: 10px; }
      .row { display: flex; gap: 10px; align-items: center; }
      .muted { color: var(--text-3); }
      .pill { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
      .dot2 { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .dot2.on { background: var(--ok); } .dot2.off { background: var(--text-3); opacity: .6; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .seg { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px; }
      .seg button, .subtabs button { background: transparent; color: var(--text-2); padding: 5px 11px; font-size: 12px; border-radius: 4px; border: 0; font-weight: 500; }
      .seg button:not(:disabled):hover, .subtabs button:not(:disabled):hover { background: var(--surface-3); color: var(--text); }
      .seg button.active, .subtabs button.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
      body.lightadm .seg button.active, body.lightadm .subtabs button.active { background: #fff; }
      .subtabs { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 2px; margin-bottom: 14px; }
      .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); cursor: pointer; user-select: none; font-weight: 500; }
      .switch .track { width: 32px; height: 18px; border-radius: 999px; background: var(--border-strong); position: relative; transition: background .15s; }
      .switch .track.on { background: var(--accent); }
      .switch .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
      .switch .track.on .knob { left: 16px; }
      .thumb { width: 36px; height: 36px; border-radius: var(--r-sm); object-fit: cover; flex-shrink: 0; background: var(--surface-3); }
      .thumb.ph { background: var(--surface-3); }
      .thumb-sm { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }

      /* ---------- Login ---------- */
      .login { max-width: 380px; margin: 14vh auto 0; padding: 0 20px; }
      .login .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 28px 28px 24px; box-shadow: var(--shadow); }
      .login .lg-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .login h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
      .login p { color: var(--text-3); font-size: 12.5px; margin: 0 0 16px; }
      .login label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-3); margin-bottom: 6px; }
      .login .row { margin-top: 14px; }
      .login .row button { width: 100%; padding: 9px 12px; }
      .login .lg-foot { text-align: center; color: var(--text-3); font-size: 11px; margin-top: 16px; }

      /* ---------- Shell ---------- */
      #app { display: flex; flex-direction: column; height: 100dvh; }
      header {
        display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; flex-shrink: 0; flex-wrap: nowrap;
        border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5;
      }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; letter-spacing: -0.01em; margin-right: 8px; white-space: nowrap; }
      .brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: #fff; display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; letter-spacing: 0; }
      .brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); margin-left: 2px; }
      body.live .brand .dot { background: var(--ok); animation: apulse 2s ease-in-out infinite; }
      .brand small { font-weight: 500; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; }
      header .spacer { flex: 1; }
      header .updated { font-size: 11px; color: var(--text-3); }
      .kpis { display: inline-flex; gap: 6px; align-items: center; }
      .kpis .k { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 4px 9px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
      .kpis .k b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
      .hdr-tools { display: flex; align-items: center; gap: 6px; }
      header button.ghost { height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; font-size: 12px; white-space: nowrap; }
      header #logout { margin-left: 4px; }
      #hdr-interval { width: auto !important; height: 30px; padding: 0 26px 0 10px !important; border-radius: var(--r-sm) !important; border: 1px solid var(--border-strong) !important; background-color: var(--surface) !important; color: var(--text-2) !important; font-size: 12px !important; font-weight: 500; cursor: pointer; }
      #hdr-interval:hover { color: var(--text) !important; background-color: var(--surface-2) !important; }
      .stale { background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--border); text-align: center; padding: 6px; font-size: 12px; font-weight: 500; }
      .layout { display: flex; flex: 1 1 auto; min-height: 0; }

      /* ---------- Sidebar ---------- */
      nav { width: 236px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 12px 10px 24px; background: var(--surface); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
      .nav-search { width: 100%; padding: 7px 10px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 12.5px; margin-bottom: 6px; }
      button.nav-group-label {
        display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 4px;
        padding: 6px 8px 4px; margin: 14px 0 2px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); cursor: pointer;
      }
      button.nav-group-label:hover { color: var(--text-2); background: transparent; }
      .nav-search + .nav-group-label { margin-top: 8px; }
      .nav-group-label .ng-n { font-size: 10px; font-weight: 600; letter-spacing: 0; color: var(--text-3); background: var(--surface-3); border-radius: 4px; padding: 0 5px; line-height: 16px; }
      .nav-group-label .ng-chev { margin-left: auto; font-size: 9px; opacity: .6; transition: transform .15s ease; }
      .nav-group-label.closed .ng-chev { transform: rotate(-90deg); }
      nav button[data-sec] {
        display: block; width: 100%; text-align: left; background: transparent; color: var(--text-2); border: 0; border-left: 2px solid transparent; border-radius: var(--r-sm);
        padding: 7px 10px; margin-bottom: 1px; font-weight: 500; font-size: 13px;
      }
      nav button[data-sec]:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
      nav button[data-sec].active { background: var(--accent-soft); color: var(--text); font-weight: 600; border-left-color: var(--accent); border-top-left-radius: 0; border-bottom-left-radius: 0; }
      @media (min-width: 821px) {
        #nav button[data-sec].grp-hidden { display: none; }
        #nav.searching button[data-sec].grp-hidden { display: block; }
      }

      /* ---------- Content ---------- */
      main { flex: 1; min-width: 0; padding: 20px 24px 32px; overflow-y: auto; overscroll-behavior: contain; }
      main > * { max-width: 1200px; margin-inline: auto; }
      .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
      .toolbar .tt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .toolbar .crumb { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
      .toolbar .crumb:empty { display: none; }
      .toolbar h2 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.015em; }
      .toolbar .spacer { flex: 1; }
      h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); margin: 24px 0 10px; }
      h4 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }

      /* Cards & KPIs */
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
      .card .n { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
      .card .l { font-size: 11.5px; color: var(--text-3); margin-top: 4px; font-weight: 500; }
      .card.kpi { position: relative; }
      .card.kpi .ki { position: absolute; top: 12px; right: 12px; width: 18px; height: 18px; color: var(--text-3); }
      .card.kpi .kt { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; font-variant-numeric: tabular-nums; }
      .card.kpi .kt.up { background: var(--ok-soft); color: var(--ok); }
      .card.kpi .kt.dn { background: var(--danger-soft); color: var(--danger); }
      .card.kpi .kt.flat { background: var(--surface-3); color: var(--text-2); }
      .kpi-grid .card { min-height: 92px; }

      /* Tables */
      table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
      th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      th { background: var(--surface-2); color: var(--text-3); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; user-select: none; white-space: nowrap; }
      th.s-asc::after { content: ' ▲'; color: var(--accent-text); font-size: 9px; }
      th.s-desc::after { content: ' ▼'; color: var(--accent-text); font-size: 9px; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover td { background: var(--surface-2); }
      tr.clickable { cursor: pointer; }
      td { font-variant-numeric: tabular-nums; }
      .card table, .modal table, .zoomed table { border: 0; border-radius: 0; background: transparent; margin-bottom: 0; }
      .codebox { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 14px; font-size: 12px; font-family: var(--mono); overflow: auto; color: var(--text-2); }
      body.compact th, body.compact td { padding: 5px 10px; }
      body.compact .card { padding: 10px 12px; }
      body.compact .srow, body.compact .brow { margin-bottom: 4px; }

      /* Rows & lists */
      .srow { display: grid; grid-template-columns: 36px minmax(0, 1.2fr) 1fr 50px; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
      .srow:last-child { border-bottom: 0; }
      .srow .sname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
      .nowcell { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
      .nowcell span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .brow { display: grid; grid-template-columns: 210px 1fr 56px; gap: 12px; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
      .brow .blabel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
      .btrack { background: var(--surface-3); border-radius: 3px; height: 8px; overflow: hidden; }
      .bfill { height: 100%; background: var(--accent); border-radius: 3px; }
      .bval { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 500; }
      .days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; align-items: end; height: 120px; margin-top: 6px; padding-top: 4px; }
      .day { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .day .col { width: 40%; max-width: 16px; min-width: 5px; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 3px; }
      .day .t { font-size: 10px; color: var(--text-3); }
      .empty { text-align: center; color: var(--text-3); padding: 28px 0; font-size: 13px; }
      div.empty { padding: 24px 14px; border: 1px dashed var(--border-strong); border-radius: var(--r); margin: 8px 0 14px; background: var(--surface); }
      .empty-state { text-align: center; padding: 40px 20px; border: 1px dashed var(--border-strong); border-radius: var(--r); background: var(--surface); margin: 8px 0 14px; }
      .empty-state svg { width: 56px; height: 56px; margin-bottom: 10px; opacity: .5; color: var(--text-2); }
      .empty-state .es-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
      .empty-state .es-hint { font-size: 12.5px; color: var(--text-3); max-width: 380px; margin: 0 auto; line-height: 1.5; }
      button.ghost.qa-go { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); font-weight: 600; }
      button.ghost.qa-go:hover { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
      .hs-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); margin-bottom: 6px; background: var(--surface); }
      .hs-row .hs-name { background: transparent; border: 0; color: var(--text); font-weight: 500; font-size: 13px; padding: 4px 6px; border-radius: 4px; }
      .hs-row .hs-name:focus { outline: 1px solid var(--accent); background: var(--surface-2); }
      .hs-row .hs-ord { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
      .hs-row.disabled { opacity: .5; }
      .sw { display: inline-flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .sw button { width: 30px; height: 30px; border-radius: var(--r-sm); padding: 0; border: 1px solid var(--border-strong); cursor: pointer; }
      .sw button.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
      .bn-preview { border-radius: var(--r); padding: 18px 20px; background: var(--surface-2); border: 1px solid var(--border); min-height: 100px; }
      .bn-preview h4 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
      .bn-preview p { margin: 0; color: var(--text-2); font-size: 13px; }
      .stub-banner { border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); border-radius: var(--r-sm); padding: 12px 14px; margin-bottom: 14px; }
      .stub-banner h4 { margin: 0 0 4px; font-size: 11px; color: var(--accent-text); letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
      .stub-banner p { margin: 4px 0 0; font-size: 12.5px; color: var(--text-2); line-height: 1.55; }
      .spk-chip { display: inline-block; position: fixed; pointer-events: none; background: var(--surface-3); border: 1px solid var(--border-strong); color: var(--text); font-size: 11px; padding: 4px 8px; border-radius: var(--r-sm); z-index: 40; opacity: 0; transition: opacity .1s; box-shadow: var(--shadow); }
      .spk-chip.show { opacity: 1; }
      .pn-kind { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-2); }
      .pn-kind.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
      .live-dot { border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 var(--accent-soft); animation: lpulse 1.8s ease-out infinite; }
      .live-dot.playing { background: var(--ok); animation-name: lpulse-p; }
      @keyframes lpulse { 0% { box-shadow: 0 0 0 0 rgba(79, 140, 255, 0.45); } 100% { box-shadow: 0 0 0 14px rgba(79, 140, 255, 0); } }
      @keyframes lpulse-p { 0% { box-shadow: 0 0 0 0 rgba(47, 191, 113, 0.45); } 100% { box-shadow: 0 0 0 14px rgba(47, 191, 113, 0); } }
      @keyframes apulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

      /* World map — dark tiles on dark, plain tiles on light. */
      #wmap { height: 440px; border-radius: var(--r); overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
      #wmap .leaflet-tile { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.4); }
      #wmap .leaflet-container { background: var(--surface-2); }
      body.lightadm #wmap .leaflet-tile { filter: saturate(0.6); }

      /* Modals & dialogs */
      .modal { position: fixed; inset: 0; background: rgba(4, 6, 10, 0.6); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px; z-index: 20; overflow: auto; }
      .modal .box { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-lg); padding: 20px 22px; box-shadow: var(--shadow-lg); }
      .modal .x { float: right; background: transparent; border: 1px solid var(--border-strong); color: var(--text-2); border-radius: var(--r-sm); width: 28px; height: 28px; padding: 0; }
      .zoomed { position: fixed !important; inset: 4vh 4vw !important; z-index: 30; overflow: auto; background: var(--surface) !important; box-shadow: var(--shadow-lg); padding: 24px !important; border-radius: var(--r-lg); border: 1px solid var(--border-strong); }
      .vxd-overlay { position: fixed; inset: 0; z-index: 300; display: flex; align-items: flex-start; justify-content: center; padding: 12vh 20px 20px; background: rgba(4, 6, 10, 0.6); animation: vxdFade .12s ease; }
      .vxd-overlay.closing { opacity: 0; transition: opacity .12s ease; pointer-events: none; }
      .vxd { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-lg); padding: 18px 20px 16px; box-shadow: var(--shadow-lg); animation: vxdPop .14s ease; }
      @keyframes vxdFade { from { opacity: 0; } }
      @keyframes vxdPop { from { opacity: 0; transform: translateY(-6px); } }
      .vxd-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
      .vxd-logo { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
      .vxd.danger .vxd-logo { background: var(--danger); }
      .vxd-msg { font-size: 14px; line-height: 1.55; color: var(--text); white-space: pre-line; overflow-wrap: break-word; }
      .vxd-input { margin-top: 12px; }
      .vxd-note { margin-top: 7px; font-size: 12px; color: var(--danger); min-height: 15px; }
      .vxd-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      .vxd-actions button { min-width: 84px; }
      .vxd.danger .vxd-ok { background: var(--danger); }
      body.lightadm .modal, body.lightadm .vxd-overlay { background: rgba(23, 26, 33, 0.35); }
      footer { text-align: center; color: var(--text-3); font-size: 11px; padding: 8px 24px; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--surface); }

      /* ---------- AI Lab ---------- */
      .lab-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .lab-chip { background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm); color: var(--text-2); padding: 8px 12px; text-align: left; font-weight: 500; }
      .lab-chip:not(:disabled):hover { background: var(--surface-2); color: var(--text); }
      .lab-chip .ln { display: block; font-size: 12.5px; }
      .lab-chip .lm { display: block; font-size: 10.5px; color: var(--text-3); margin-top: 2px; font-weight: 500; }
      .lab-chip.active { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
      .lab-chip.active .lm { color: var(--accent-text); }
      .lab-msgs { display: flex; flex-direction: column; gap: 4px; max-height: 52vh; min-height: 120px; overflow-y: auto; padding: 4px 2px; margin-bottom: 12px; }
      .lab-msg { max-width: 84%; border-radius: var(--r); padding: 9px 13px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; margin-top: 6px; }
      .lab-msg.user { align-self: flex-end; background: var(--accent-soft); border: 1px solid var(--accent); }
      .lab-msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border-strong); }
      .lab-msg.err { align-self: flex-start; background: var(--danger-soft); border: 1px solid var(--danger); color: var(--text); }
      .lab-meta { align-self: flex-start; font-size: 10.5px; color: var(--text-3); padding-left: 4px; }
      .lab-input { width: 100%; min-height: 62px; resize: vertical; }
      .lab-cursor::after { content: '▍'; color: var(--accent); animation: apulse 1s ease-in-out infinite; }
      .lab-ping { font-size: 11px; padding: 3px 9px; border-radius: 4px; background: var(--surface-3); color: var(--text-2); white-space: nowrap; border: 1px solid var(--border); }
      .lab-ping.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
      .lab-ping.bad { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
      .lab-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); margin-right: 6px; vertical-align: 1px; }
      .lab-dot.ok { background: var(--ok); } .lab-dot.warn { background: var(--warn); } .lab-dot.bad { background: var(--danger); }
      .lab-ping-at { font-size: 11px; color: var(--text-3); white-space: nowrap; }

      /* ---------- Seasonal skin (Aug 14–15) — restrained tricolour rule ---------- */
      html.fest-ind body::after { content: ''; position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 99; pointer-events: none; background: linear-gradient(90deg, #ff9933 0 33.4%, #fff 33.4% 66.7%, #138808 66.7% 100%); }
      .fest-sky { display: none; }
      .fest-badge { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: #ff9933; border: 1px solid rgba(255, 153, 51, 0.5); }

      /* ---------- Motion: entrances only, short ---------- */
      #view.enter > * { animation: rise .22s ease both; }
      @keyframes rise { from { transform: translateY(4px); opacity: 0; } to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #view.enter > *, .bfill, .day .col, .vxd-overlay, .vxd { animation: none !important; }
        .live-dot { animation: none; }
      }
      @media print {
        nav, header, footer, #stale { display: none !important; }
        body { background: #fff !important; color: #000 !important; }
        .card { border-color: #bbb; break-inside: avoid; }
        main { max-width: none; }
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 1080px) { nav { width: 208px; } main { padding: 16px; } }
      @media (max-width: 820px) {
        header { height: auto; padding: 8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); gap: 6px; flex-wrap: wrap; }
        header .updated, #kpis, #json, #report, #notify { display: none; }
        header .spacer { display: none; }
        .hdr-tools { width: 100%; overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 2px; }
        .hdr-tools::-webkit-scrollbar { display: none; }
        .switch { white-space: nowrap; }
        .layout { flex-direction: column; }
        nav { width: 100%; display: flex; align-items: center; gap: 6px; padding: 8px 10px; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--border); -webkit-overflow-scrolling: touch; }
        nav .nav-group-label, .nav-search { display: none; }
        nav button[data-sec] { width: auto; flex: none; white-space: nowrap; margin-bottom: 0; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 12.5px; }
        nav button[data-sec].active { border-color: var(--accent); background: var(--accent-soft); border-radius: 999px; }
        main { padding: 14px 12px calc(14px + env(safe-area-inset-bottom)); }
        .cards { grid-template-columns: repeat(auto-fit, minmax(124px, 1fr)); gap: 8px; }
        .card .n { font-size: 20px; }
        .brow { grid-template-columns: 108px 1fr 46px; gap: 8px; }
        .srow { grid-template-columns: 32px minmax(0, 1.3fr) 1fr 44px; gap: 8px; }
        #view table { display: block; overflow-x: auto; white-space: nowrap; }
        .modal { padding: 3vh 10px; }
        .vxd-overlay { padding: 9vh 12px 16px; }
        .toolbar h2 { font-size: 16px; }
        .zoomed { inset: 2vh 2vw !important; padding: 14px !important; }
      }
      @media (pointer: coarse) {
        button { min-height: 36px; }
        button.icon-btn { width: 36px; height: 36px; }
        .switch .track { width: 38px; height: 21px; }
        .switch .knob { width: 17px; height: 17px; }
        .switch .track.on .knob { left: 19px; }
      }
      @media (min-width: 1880px) { body { zoom: 1.1; } main > * { max-width: 1400px; } nav { width: 256px; } }
    </style>
  </head>
  <body>
    <div id="login" class="login">
      <div class="panel">
        <div class="lg-brand"><span class="brand"><span class="mark">V</span> VinaX <small>Admin</small></span></div>
        <h2>Sign in to the console</h2>
        <p>Enter the admin token to open the dashboards.</p>
        <label for="token">Admin token</label>
        <input id="token" type="password" placeholder="••••••••••••" autocomplete="off" />
        <div class="row"><button id="enter">Open console</button></div>
        <div id="loginErr" class="err"></div>
      </div>
      <p class="lg-foot">Token-gated · coarse, anonymous data only</p>
    </div>

    <div id="app" hidden>
      <header>
        <div class="brand"><span class="mark">V</span> VinaX <small>Admin</small><span class="dot" title="Auto-refresh status"></span></div>
        <div id="kpis" class="kpis" title="Live pulse — refreshes every minute"></div>
        <div class="spacer"></div>
        <div class="hdr-tools">
          <div class="seg" id="range" hidden></div>
          <label class="switch" id="autoWrap"><span class="track on" id="autoTrack"><span class="knob"></span></span> Auto-refresh</label>
          <button class="ghost" id="csv" hidden title="Download this table as CSV">CSV</button>
          <button class="ghost" id="json" title="Download this panel as JSON">JSON</button>
          <button class="ghost" id="report" title="Copy a day report to the clipboard">Report</button>
          <button class="ghost" id="notify" title="Browser alert when new errors appear">Alerts</button>
          <button class="ghost" id="theme" title="Light / dark">Theme</button>
          <button class="ghost" id="refresh" title="Refresh now">Refresh</button>
          <button class="ghost" id="logout">Sign out</button>
        </div>
      </header>
      <div id="stale" class="stale" hidden>Data looks stale — refresh may be failing.</div>
      <div class="layout">
        <nav id="nav">
          <input id="navSearch" class="nav-search" type="search" placeholder="Search tools… (⌘K)" aria-label="Filter tools" />
          <!-- v5.7.5 — formal category reorganisation: every tool sits under
               exactly one category; category headers collapse (state kept per
               browser) and show their tool count. Categories are ordered by
               daily workflow: watch → audience → catalog → promotion →
               reports → AI → operations → settings. -->
          <button class="nav-group-label" data-group="Dashboards" aria-expanded="true">Dashboards <span class="ng-n">2</span><span class="ng-chev">▾</span></button>
          <button data-sec="overview" data-cat="Dashboards" class="active">Overview</button>
          <button data-sec="realtime" data-cat="Dashboards">Real-Time</button>
          <button class="nav-group-label" data-group="Audience" aria-expanded="true">Audience <span class="ng-n">4</span><span class="ng-chev">▾</span></button>
          <button data-sec="live" data-cat="Audience">Live Listening</button>
          <button data-sec="activity" data-cat="Audience">Activity Feed</button>
          <button data-sec="engagement" data-cat="Audience">Engagement</button>
          <button data-sec="users" data-cat="Audience">User Management</button>
          <button class="nav-group-label" data-group="Catalog" aria-expanded="true">Catalog <span class="ng-n">5</span><span class="ng-chev">▾</span></button>
          <button data-sec="songs" data-cat="Catalog">Song Management</button>
          <button data-sec="playlists" data-cat="Catalog">Playlist Management</button>
          <button data-sec="homescreen" data-cat="Catalog">Home Screen</button>
          <button data-sec="categories" data-cat="Catalog">Categories &amp; Genres</button>
          <button data-sec="content" data-cat="Catalog">Content Control</button>
          <button class="nav-group-label" data-group="Promotion" aria-expanded="true">Promotion <span class="ng-n">3</span><span class="ng-chev">▾</span></button>
          <button data-sec="banners" data-cat="Promotion">Banners &amp; Offers</button>
          <button data-sec="festivals" data-cat="Promotion">Festival Themes</button>
          <button data-sec="notify2" data-cat="Promotion">Notifications</button>
          <button class="nav-group-label" data-group="Analytics" aria-expanded="true">Analytics <span class="ng-n">6</span><span class="ng-chev">▾</span></button>
          <button data-sec="music" data-cat="Analytics">Music Analytics</button>
          <button data-sec="search" data-cat="Analytics">Search Analytics</button>
          <button data-sec="location" data-cat="Analytics">Location Analytics</button>
          <button data-sec="world" data-cat="Analytics">World Map</button>
          <button data-sec="insights" data-cat="Analytics">Insights</button>
          <button data-sec="experiments" data-cat="Analytics">A/B Experiments</button>
          <button class="nav-group-label" data-group="AI &amp; Engines" aria-expanded="true">AI &amp; Engines <span class="ng-n">2</span><span class="ng-chev">▾</span></button>
          <button data-sec="ai" data-cat="AI &amp; Engines">AI Monitoring</button>
          <button data-sec="ailab" data-cat="AI &amp; Engines">API Monitoring</button>
          <button class="nav-group-label" data-group="Operations" aria-expanded="true">Operations <span class="ng-n">3</span><span class="ng-chev">▾</span></button>
          <button data-sec="technical" data-cat="Operations">Technical Monitoring</button>
          <button data-sec="feedback" data-cat="Operations">Feedback &amp; Bugs</button>
          <button data-sec="rooms" data-cat="Operations">Live Rooms</button>
          <button class="nav-group-label" data-group="Settings" aria-expanded="true">Settings <span class="ng-n">1</span><span class="ng-chev">▾</span></button>
          <button data-sec="config" data-cat="Settings">App Configuration</button>
        </nav>
        <main>
          <div class="toolbar"><div class="tt"><span id="secCrumb" class="crumb"></span><h2 id="secTitle">Overview</h2></div><div class="spacer"></div><span class="updated" id="updated">—</span></div>
          <div id="view"><div class="empty">Loading…</div></div>
        </main>
      </div>
      <footer>VinaX Admin Console · token-gated · coarse, anonymous data only</footer>
    </div>

    <div id="modal" class="modal" hidden><div class="box" id="modalBody"></div></div>

    <script src="/admin/leaflet/leaflet.js"></script>
    <script src="/admin/app.js"></script>
  </body>
</html>
