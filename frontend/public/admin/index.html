    <!-- Sign-in -->
    <main id="login" class="login" hidden>
      <div class="login-card">
        <div class="brand-mark" aria-hidden="true">V</div>
        <h1>VinaX Console</h1>
        <p class="muted">Sign in with the Google account an Owner added to the admin list.</p>
        <div id="gsiBtn" class="gsi-btn"></div>
        <p id="loginErr" class="login-err" role="alert" aria-live="polite"></p>
        <details id="pwBox" class="pw-box" hidden>
          <summary>Owner recovery password</summary>
          <form id="loginForm" autocomplete="off">
            <p class="muted small">Only for the owner when Google sign-in is not available. It is kept in this tab only.</p>
            <label class="field-label" for="token">Recovery password</label>
            <input id="token" class="input" type="password" autocomplete="current-password" />
            <button id="enter" class="btn ghost block" type="submit"><span>Sign in with password</span></button>
          </form>
        </details>
      </div>
    </main>

    <!-- Console -->
    <div id="app" class="app" hidden>
      <a class="skip" href="#main">Skip to content</a>
      <aside id="sidebar" class="sidebar" aria-label="Console menu">
        <div class="sb-brand">
          <div class="brand-mark sm" aria-hidden="true">V</div>
          <div class="sb-brand-text"><strong>VinaX</strong><span>Admin console</span></div>
          <button id="railBtn" class="icon-btn sb-rail-btn" type="button" aria-label="Collapse the menu" aria-pressed="false" title="Collapse or expand the menu"><svg class="ic" aria-hidden="true"><use href="#i-rail"/></svg></button>
          <button id="sbClose" class="icon-btn sb-close" type="button" aria-label="Close menu"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <button id="paletteBtn" class="sb-search" type="button"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>Search…</span><kbd>Ctrl K</kbd></button>
        <label class="nav-filter-wrap"><span class="sr-only">Find a page</span><input id="navFilter" class="nav-filter" type="search" placeholder="Find a page" autocomplete="off" spellcheck="false"></label>
        <nav id="nav" class="nav"></nav>
        <div class="sb-foot">
          <span id="envChip" class="env-chip">Live site</span>
          <span id="buildChip" class="muted small"></span>
        </div>
      </aside>
      <div id="scrimNav" class="scrim-nav" hidden></div>

      <div class="main-col">
        <header class="topbar">
          <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
          <nav id="crumbs" class="crumbs" aria-label="You are here"><h1 id="pageTitle">Dashboard</h1></nav>
          <span class="grow"></span>
          <button id="searchBtn" class="icon-btn" type="button" aria-label="Search (Ctrl K)" title="Search (Ctrl K)"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button>
          <span id="rangeHost" class="range-host" hidden></span>
          <div class="auto-box">
            <label class="switch compact" title="Refresh this page by itself">
              <input id="autoRefresh" type="checkbox" role="switch" /><span class="track" aria-hidden="true"></span><span class="switch-label">Auto-refresh</span>
            </label>
            <select id="autoMs" class="input compact" aria-label="Auto-refresh every">
              <option value="15000">15 s</option><option value="30000">30 s</option><option value="60000">1 min</option><option value="300000">5 min</option>
            </select>
          </div>
          <span id="updated" class="muted small updated" aria-live="polite"></span>
          <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh now" title="Refresh now (R)"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg></button>
          <select id="themeSel" class="input compact theme-sel" aria-label="Theme">
            <option value="light">Light</option><option value="dark">Dark</option><option value="system">Match my device</option>
          </select>
          <div class="profile">
            <button id="profileBtn" class="profile-btn" type="button" aria-label="Profile" aria-haspopup="dialog"><span class="avatar">A</span></button>
            <div id="profilePop" class="profile-pop" role="dialog" aria-label="Your profile" hidden></div>
          </div>
        </header>
        <main id="main" class="page" tabindex="-1">
          <div id="dbBanner" class="db-banner" hidden></div>
          <p id="pageDesc" class="page-desc muted"></p>
          <div id="pageTabs"></div>
          <div id="pageBody" class="page-body"></div>
        </main>
      </div>
      <!-- Phones: the pages used most, one tap away; Menu opens every page. -->
      <nav id="bottomBar" class="bottom-bar" aria-label="Quick pages">
        <a class="bb-link" href="#/dashboard" data-page="dashboard"><svg class="ic" aria-hidden="true"><use href="#i-grid"/></svg><span>Dashboard</span></a>

        <button id="bbMenu" class="bb-link" type="button" aria-controls="sidebar" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg><span>Menu</span></button>
      </nav>
