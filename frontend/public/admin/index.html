<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Strict CSP for the owner console: no inline scripts, no third-party
         script hosts, so an injection slip cannot execute. Every console
         script builds DOM through VX.h (text nodes), never innerHTML.
         style-src keeps 'unsafe-inline' for style="" attributes on chart
         bars and swatches. connect-src adds the geocoder used by the map. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; connect-src 'self'" />
    <meta name="theme-color" content="#0e0f13" />
    <title>VinaX · Console</title>
    <link rel="icon" href="/favicon.ico" />
    <script src="/admin/theme-boot.js"></script>
    <link rel="stylesheet" href="/admin/console.css" />
  </head>
  <body>

    <!-- Sign-in -->
    <main id="login" class="login" hidden>
      <form id="loginForm" class="login-card" autocomplete="off">
        <div class="brand-mark" aria-hidden="true">V</div>
        <h1>VinaX Console</h1>
        <p class="muted">Owner sign-in. The password is checked by the server on every request and is kept only in this tab.</p>
        <label class="field-label" for="token">Owner password</label>
        <input id="token" class="input" type="password" autocomplete="current-password" required />
        <p id="loginErr" class="login-err" role="alert"></p>
        <button id="enter" class="btn primary block" type="submit"><span>Sign in</span></button>
      </form>
    </main>

    <!-- Console -->
    <div id="app" class="app" hidden>
      <a class="skip" href="#main">Skip to content</a>
      <aside id="sidebar" class="sidebar" aria-label="Console navigation">
        <div class="sb-brand">
          <div class="brand-mark sm" aria-hidden="true">V</div>
          <div class="sb-brand-text"><strong>VinaX</strong><span>Console</span></div>
          <button id="sbClose" class="icon-btn sb-close" type="button" aria-label="Close menu"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
        </div>
        <button id="paletteBtn" class="sb-search" type="button"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span>Jump to…</span><kbd>Ctrl K</kbd></button>
        <nav id="nav" class="nav"></nav>
        <div class="sb-foot">
          <span id="envChip" class="env-chip">Production</span>
          <span id="buildChip" class="muted small"></span>
        </div>
      </aside>
      <div id="scrimNav" class="scrim-nav" hidden></div>

      <div class="main-col">
        <header class="topbar">
          <button id="menuBtn" class="icon-btn menu-btn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
          <div class="crumbs"><span id="crumbGroup" class="muted"></span><span class="muted sep" aria-hidden="true">/</span><h1 id="pageTitle">Overview</h1></div>
          <span class="grow"></span>
          <span id="updated" class="muted small" aria-live="polite"></span>
          <label class="switch compact" title="Refresh this page every 30 seconds">
            <input id="autoRefresh" type="checkbox" role="switch" /><span class="track" aria-hidden="true"></span><span class="switch-label">Auto</span>
          </label>
          <button id="refreshBtn" class="icon-btn" type="button" aria-label="Refresh" title="Refresh (R)"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg></button>
          <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch theme" title="Switch theme"><svg class="ic" aria-hidden="true"><use href="#i-theme"/></svg></button>
          <button id="logoutBtn" class="icon-btn" type="button" aria-label="Sign out" title="Sign out"><svg class="ic" aria-hidden="true"><use href="#i-logout"/></svg></button>
        </header>
        <main id="main" class="page" tabindex="-1">
          <p id="pageDesc" class="page-desc muted"></p>
          <div id="pageTabs"></div>
          <div id="pageBody" class="page-body"></div>
        </main>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="/admin/core.js"></script>
    <script src="/admin/pages/overview.js"></script>
    <script src="/admin/pages/live.js"></script>
    <script src="/admin/pages/listeners.js"></script>
    <script src="/admin/pages/analytics.js"></script>
    <script src="/admin/pages/feedback.js"></script>
    <script src="/admin/pages/experiments.js"></script>
    <script src="/admin/pages/ai.js"></script>
    <script src="/admin/pages/catalog.js"></script>
    <script src="/admin/pages/publish.js"></script>
    <script src="/admin/pages/notify.js"></script>
    <script src="/admin/pages/database.js"></script>
    <script src="/admin/pages/health.js"></script>
    <script src="/admin/app.js"></script>
  </body>
</html>
