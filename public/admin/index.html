<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Audit finding H-SRV-10: strict CSP for the admin console. Blocks
         inline scripts and any script host except our own, so a stray
         unescaped-innerHTML slip can't execute injected <script>. Styles keep
         'unsafe-inline' because the file uses a large embedded <style> block
         (removing that would need a bigger refactor). connect-src is set to
         'self' + Supabase for direct client hits (currently unused by this
         console, kept as a hedge for future direct queries). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co" />
    <title>VinaX Admin</title>
    <style>
      :root { color-scheme: dark; --ember: #22d3ee; --pink: #a78bfa; --grad: linear-gradient(135deg, #22d3ee, #60a5fa); }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      .thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
      .thumb.ph { background: #1b1b27; }
      .thumb-sm { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
      .srow { display: grid; grid-template-columns: 40px minmax(0,1.2fr) 1fr 50px; gap: 12px; align-items: center; margin-bottom: 8px; font-size: 13px; }
      .srow .sname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .nowcell { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
      .nowcell span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      body {
        margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ecebf4;
        background:
          radial-gradient(52% 40% at 10% -6%, rgba(34, 211, 238, 0.12), transparent 62%),
          radial-gradient(46% 36% at 96% 2%, rgba(167, 139, 250, 0.1), transparent 60%),
          #060609;
        background-attachment: fixed;
      }
      .login { max-width: 360px; margin: 14vh auto; text-align: center; padding: 0 20px; }
      .login h2 { font-size: 20px; }
      .login p { color: #8a8a99; font-size: 13px; }
      input[type="password"], input[type="text"], input[type="search"] {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #2a2a38; background: #13131c; color: #fff; font-size: 14px;
      }
      button { padding: 9px 14px; border-radius: 999px; border: 0; cursor: pointer; background: var(--grad); color: #fff; font-weight: 700; font-size: 13px; }
      button.ghost { background: transparent; border: 1px solid #2a2a38; color: #cfcfda; }
      button:disabled { opacity: .4; cursor: not-allowed; }
      .err { color: #ff6b6b; font-size: 13px; margin-top: 10px; }
      .row { display: flex; gap: 10px; align-items: center; }
      header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); position: sticky; top: 0; background: rgba(9,9,14,0.6); backdrop-filter: blur(22px) saturate(150%); z-index: 5; flex-wrap: wrap; }
      .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; }
      .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 12px var(--ember); }
      .brand small { font-weight: 600; color: #8a8a99; font-size: 12px; }
      header .spacer { flex: 1; }
      header .updated { font-size: 11px; color: #6f6f7e; }
      .seg { display: inline-flex; gap: 4px; background: #111119; border: 1px solid #20202c; border-radius: 999px; padding: 3px; }
      .seg button { background: transparent; color: #9a9aa8; padding: 6px 12px; font-size: 12px; }
      .seg button.active { background: var(--grad); color: #fff; }
      .switch { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: #aab; cursor: pointer; user-select: none; }
      .switch .track { width: 34px; height: 19px; border-radius: 999px; background: #2a2a38; position: relative; transition: background .15s; }
      .switch .track.on { background: var(--ember); }
      .switch .knob { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: left .15s; }
      .switch .track.on .knob { left: 17px; }
      /* Fixed-height shell: the window itself never scrolls — the nav and the
         section content each scroll on their own, so the sidebar and header
         stay put however deep you read (and no rubber-band gap up top). */
      #app { display: flex; flex-direction: column; height: 100dvh; }
      header { flex-shrink: 0; }
      .layout { display: flex; flex: 1 1 auto; min-height: 0; }
      nav { width: 220px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.06); padding: 14px 12px; background: rgba(10,10,16,0.4); backdrop-filter: blur(16px); overflow-y: auto; overscroll-behavior: contain; }
      nav button[data-sec] { display: block; width: 100%; text-align: left; background: transparent; color: #9a9aa8; border: 0; border-radius: 10px; padding: 10px 14px; margin-bottom: 2px; font-weight: 600; font-size: 13.5px; }
      nav button.active { background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(96,165,250,0.14)); color: #fff; box-shadow: inset 0 0 0 1px rgba(34,211,238,0.35); }
      nav button:hover:not(:disabled) { background: #121219; }
      /* Sidebar groups + search — Task 2 & 5 */
      .nav-group-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.4); margin: 20px 8px 6px; font-weight: 700; }
      .nav-group-label:first-child, .nav-search + .nav-group-label { margin-top: 8px; }
      .nav-search { width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid #23232f; background: #0f0f16; color: #fff; font-size: 12.5px; margin-bottom: 4px; }
      body.lightadm .nav-group-label { color: rgba(0,0,0,0.42); }
      body.lightadm .nav-search { background: #fff; color: #111; border-color: #d5d7e2; }
      main { flex: 1; min-width: 0; padding: 20px; max-width: 1000px; overflow-y: auto; overscroll-behavior: contain; }
      .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
      .toolbar h2 { font-size: 17px; margin: 0; }
      .toolbar .spacer { flex: 1; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 13px; margin-bottom: 22px; }
      .card {
        background: rgba(24, 22, 34, 0.5); border: 1px solid rgba(255,255,255,0.09); border-radius: 18px; padding: 15px 17px;
        backdrop-filter: blur(18px) saturate(150%);
        box-shadow: inset 0 1px 1px rgba(255,255,255,0.07), 0 12px 32px -16px rgba(0,0,0,0.6);
      }
      .card .n { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; } .card .l { font-size: 12px; color: #8a8a99; margin-top: 3px; }
      /* KPI polish — hairline border, icon slot, trend chip */
      .card.kpi { position: relative; padding: 14px 16px; }
      .card.kpi .ki { position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; opacity: .5; color: var(--ember); }
      .card.kpi .kt { display: inline-block; margin-top: 5px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; letter-spacing: .02em; }
      .card.kpi .kt.up { background: rgba(34,211,238,0.12); color: #22d3ee; }
      .card.kpi .kt.dn { background: rgba(255,124,140,0.12); color: #ff7c8c; }
      .card.kpi .kt.flat { background: rgba(255,255,255,0.06); color: #9a9aa8; }
      body.lightadm .card.kpi .kt.up { background: rgba(14,116,144,0.12); color: #0e7490; }
      body.lightadm .card.kpi .kt.dn { background: rgba(190,40,60,0.12); color: #b91c3c; }
      /* Empty-state illustration (Task 4) */
      .empty-state { text-align: center; padding: 40px 20px; border: 1px dashed rgba(255,255,255,0.14); border-radius: 16px; background: rgba(255,255,255,0.02); margin: 8px 0 14px; }
      .empty-state svg { width: 68px; height: 68px; margin-bottom: 12px; opacity: 0.55; }
      .empty-state .es-title { font-size: 14px; font-weight: 700; color: #cfcfda; margin-bottom: 4px; }
      .empty-state .es-hint { font-size: 12.5px; color: #7a7a8a; max-width: 380px; margin: 0 auto; line-height: 1.5; }
      body.lightadm .empty-state { border-color: #d5d7e2; background: #fbfbfe; }
      body.lightadm .empty-state .es-title { color: #17171f; }
      body.lightadm .empty-state .es-hint { color: #6b6b80; }
      /* Interval selector polish (Task 5) */
      #hdr-interval { padding: 6px 30px 6px 12px !important; border-radius: 999px !important; border: 1px solid #2a2a38 !important; background: #13131c url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' width='10' height='7'><path fill='%239a9aa8' d='M6 8L0 0h12z'/></svg>") no-repeat right 10px center !important; color: #cfcfda !important; font-size: 12px !important; font-weight: 600; appearance: none; -webkit-appearance: none; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
      #hdr-interval:hover { border-color: rgba(34,211,238,0.4) !important; box-shadow: 0 0 0 3px rgba(34,211,238,0.08); }
      /* Quick-actions button lift + gradient (Task 3) */
      .qa-go { transition: transform .15s ease, box-shadow .15s ease, background .15s ease !important; }
      .qa-go:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -12px rgba(34,211,238,0.5); }
      /* Sparkline hover chip */
      .spk-chip { display: inline-block; position: fixed; pointer-events: none; background: #13131c; border: 1px solid #2a2a38; color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 8px; z-index: 40; opacity: 0; transition: opacity .1s; }
      .spk-chip.show { opacity: 1; }
      /* Homescreen row */
      .hs-row { display: grid; grid-template-columns: 24px 1fr 44px auto auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; margin-bottom: 6px; background: rgba(24,22,34,0.35); }
      .hs-row .hs-name { background: transparent; border: 0; color: #ecebf4; font-weight: 600; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
      .hs-row .hs-name:focus { outline: 1px solid rgba(34,211,238,0.5); background: rgba(0,0,0,0.25); }
      .hs-row .hs-ord { color: #6f6f7e; font-variant-numeric: tabular-nums; font-size: 12px; }
      .hs-row.disabled { opacity: 0.45; }
      body.lightadm .hs-row { background: #fbfbfe; border-color: #dfe1ea; }
      body.lightadm .hs-row .hs-name { color: #17171f; }
      /* Accent swatch */
      .sw { display: inline-flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .sw button { width: 34px; height: 34px; border-radius: 12px; padding: 0; border: 1px solid rgba(255,255,255,0.18); cursor: pointer; }
      .sw button.on { box-shadow: 0 0 0 2px var(--ember), 0 0 12px rgba(34,211,238,0.4); transform: scale(1.05); }
      /* Banner preview card */
      .bn-preview { border-radius: 18px; padding: 20px 22px; background: linear-gradient(135deg, rgba(34,211,238,0.22), rgba(167,139,250,0.14)); border: 1px solid rgba(255,255,255,0.14); min-height: 110px; }
      .bn-preview h4 { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
      .bn-preview p { margin: 0; opacity: .78; font-size: 13px; }
      /* AI-managed coming-soon banner */
      .stub-banner { border: 1px dashed rgba(167,139,250,0.4); background: linear-gradient(135deg, rgba(167,139,250,0.06), rgba(34,211,238,0.04)); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
      .stub-banner h4 { margin: 0 0 4px; font-size: 13px; color: #a78bfa; letter-spacing: .04em; text-transform: uppercase; }
      .stub-banner p { margin: 4px 0 0; font-size: 12.5px; color: #9a9aa8; line-height: 1.55; }
      body.lightadm .stub-banner { background: #f7f4ff; border-color: #d4c8f0; }
      body.lightadm .stub-banner h4 { color: #6d4bd9; }
      /* Tabs — reused for song/playlist stub sections */
      .subtabs { display: inline-flex; gap: 4px; background: #111119; border: 1px solid #20202c; border-radius: 999px; padding: 3px; margin-bottom: 14px; }
      .subtabs button { background: transparent; color: #9a9aa8; padding: 6px 14px; font-size: 12px; border-radius: 999px; }
      .subtabs button.active { background: var(--grad); color: #fff; }
      h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #8a8a99; margin: 24px 0 11px; }
      table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
      th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #16161d; }
      th { color: #8a8a99; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
      tr.clickable { cursor: pointer; } tr.clickable:hover td { background: #101018; }
      .muted { color: #6f6f7e; }
      .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1b1b27; color: #aab; }
      .dot2 { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .dot2.on { background: #36d399; } .dot2.off { background: #555; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
      .empty { text-align: center; color: #6f6f7e; padding: 30px 0; font-size: 13px; }
      /* Consistent empty-state treatment (block form only — table cells stay plain). */
      div.empty { padding: 24px 14px; border: 1px dashed rgba(255,255,255,0.16); border-radius: 14px; margin: 8px 0 14px; }
      /* Quick actions are navigation links — clearly enabled, cyan-tinted. */
      button.ghost.qa-go { background: rgba(34,211,238,0.10); border-color: rgba(34,211,238,0.4); color: #b9ecf7; }
      button.ghost.qa-go:hover { background: rgba(34,211,238,0.18); }
      .brow { display: grid; grid-template-columns: 210px 1fr 56px; gap: 12px; align-items: center; margin-bottom: 7px; font-size: 13px; }
      .brow .blabel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .btrack { background: #15151e; border-radius: 6px; height: 16px; overflow: hidden; }
      .bfill { height: 100%; background: var(--grad); border-radius: 6px; }
      .bval { text-align: right; color: #cfcfda; }
      .days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; align-items: end; height: 120px; margin-top: 6px; padding-top: 4px; }
      .day { display: flex; flex-direction: column; align-items: center; gap: 4px; }
      /* Slim, fully-rounded bars — proper chart, not colour blocks. */
      .day .col { width: 34%; max-width: 14px; min-width: 5px; background: linear-gradient(180deg, #60a5fa, #22d3ee); border-radius: 999px; min-height: 3px; }
      .day .t { font-size: 10px; color: #6f6f7e; }
      .modal { position: fixed; inset: 0; background: #04040799; backdrop-filter: blur(4px); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 20; overflow: auto; }
      .modal .box { width: 100%; max-width: 640px; background: rgba(18,17,28,0.92); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px 22px; backdrop-filter: blur(24px); }
      .modal .x { float: right; background: transparent; border: 1px solid #2a2a38; color: #cfcfda; border-radius: 999px; width: 30px; height: 30px; padding: 0; }
      footer { text-align: center; color: #4a4a55; font-size: 11px; padding: 8px 24px; flex-shrink: 0; }
      @keyframes apulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      body.live .brand .dot { animation: apulse 2s ease-in-out infinite; }
      body.compact th, body.compact td { padding: 5px 10px; }
      body.compact .card { padding: 10px 12px; }
      body.compact .srow, body.compact .brow { margin-bottom: 4px; }

      /* ---------- Dashboard motion (flat + calm — 3D tilts retired) ----------
         The old perspective/rotateX layer tilted whole tables on hover and, as
         a side effect, broke the dblclick zoom overlay (perspective on <main>
         turned position:fixed into position:absolute-in-main). Entrances stay,
         depth theatrics go. */
      .card { transition: box-shadow .18s ease; }
      .card:hover { box-shadow: 0 18px 40px -16px #000d; }
      #view.enter > * { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
      #view.enter > *:nth-child(2) { animation-delay: .06s; }
      #view.enter > *:nth-child(3) { animation-delay: .12s; }
      #view.enter > *:nth-child(4) { animation-delay: .18s; }
      #view.enter > *:nth-child(5) { animation-delay: .24s; }
      @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
      .bfill { transform-origin: left; animation: growx .6s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes growx { from { transform: scaleX(0); } }
      .day .col { transform-origin: bottom; animation: growy .55s cubic-bezier(.2,.8,.2,1) both; }
      @keyframes growy { from { transform: scaleY(0); } }
      .toolbar h2 { position: relative; padding-left: 24px; }
      .toolbar h2::before { content: ''; position: absolute; left: 0; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--grad); opacity: .85; }
      .kpis { display: inline-flex; gap: 8px; align-items: center; }
      .kpis .k { background: rgba(24,22,34,0.55); border: 1px solid rgba(255,255,255,0.1); border-radius: 999px; padding: 5px 12px; font-size: 12px; color: #9a9aa8; white-space: nowrap; backdrop-filter: blur(12px); }
      .kpis .k b { color: #fff; display: inline-block; }
      th { cursor: pointer; user-select: none; }
      th.s-asc::after { content: ' ▲'; color: var(--ember); }
      th.s-desc::after { content: ' ▼'; color: var(--ember); }
      .zoomed { position: fixed !important; inset: 4vh 4vw !important; z-index: 30; overflow: auto; background: #0d0d15 !important; box-shadow: 0 40px 90px #000d; padding: 24px !important; border-radius: 18px; }
      .stale { background: #40191c; color: #ffb3b3; text-align: center; padding: 6px; font-size: 12px; }
      /* ---------- Light admin: real contrast, not washed grey ---------- */
      body.lightadm { background: #f2f3f8; color: #17171f; }
      body.lightadm header { background: #f2f3f8dd; border-bottom-color: #dcdde6; }
      body.lightadm nav { border-right-color: #dcdde6; background: rgba(255,255,255,0.55); }
      body.lightadm nav button { color: #33334a; }
      body.lightadm nav button:hover:not(:disabled) { background: #e6e8f2; }
      body.lightadm nav button.active { background: linear-gradient(135deg, rgba(14,116,144,0.16), rgba(37,99,235,0.10)); color: #093c52; box-shadow: inset 0 0 0 1px rgba(14,116,144,0.4); }
      body.lightadm .card, body.lightadm .kpis .k { background: #fff; border-color: #dfe1ea; box-shadow: 0 8px 24px -18px rgba(31,38,90,0.35); }
      body.lightadm .kpis .k { color: #4a4a60; }
      body.lightadm .kpis .k b { color: #111; }
      body.lightadm th, body.lightadm td { border-bottom-color: #e6e7ef; }
      body.lightadm th { color: #5d5d74; }
      body.lightadm tr.clickable:hover td { background: #eef0f7; }
      body.lightadm .btrack { background: #e8eaf2; }
      body.lightadm .modal { background: #3a3a5533; }
      body.lightadm .modal .box, body.lightadm .zoomed { background: #fff !important; }
      body.lightadm input[type="password"], body.lightadm input[type="text"], body.lightadm input[type="search"] { background: #fff; color: #111; border-color: #d5d7e2; }
      body.lightadm button.ghost { border-color: #c7cadb; color: #33334a; }
      body.lightadm button.ghost.qa-go { background: rgba(14,116,144,0.08); border-color: rgba(14,116,144,0.38); color: #0a6c80; }
      body.lightadm button.ghost.qa-go:hover { background: rgba(14,116,144,0.15); }
      body.lightadm .seg { background: #e8eaf2; border-color: #d5d7e2; }
      body.lightadm .seg button { color: #4a4a60; }
      body.lightadm .switch { color: #3d3d52; }
      body.lightadm .switch .track { background: #cdd0de; }
      body.lightadm .muted { color: #6b6b80; }
      body.lightadm h3 { color: #5d5d74; }
      body.lightadm .card .l { color: #5d5d74; }
      body.lightadm .empty { color: #6f6f86; }
      body.lightadm div.empty { border-color: #cfd2e0; background: #fbfbfe; }
      body.lightadm .day .t { color: #6f6f86; }
      body.lightadm header .updated { color: #6f6f86; }
      body.lightadm .brand small { color: #6f6f86; }
      body.lightadm .pill { background: #e8eaf2; color: #4a4a60; }
      body.lightadm .dot2.off { background: #b7b7c6; }
      body.lightadm .thumb.ph { background: #e2e4ee; }
      body.lightadm footer { color: #8a8a99; }
      body.lightadm .stale { background: #ffe9c7; color: #7a4e00; }
      /* ---------- AI Lab ---------- */
      .lab-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .lab-chip { background: #111119; border: 1px solid #20202c; border-radius: 14px; color: #9a9aa8; padding: 8px 12px; text-align: left; font-weight: 600; }
      .lab-chip .ln { display: block; font-size: 12.5px; }
      .lab-chip .lm { display: block; font-size: 10.5px; color: #6f6f7e; margin-top: 2px; font-weight: 500; }
      .lab-chip.active { background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(96,165,250,0.14)); color: #fff; box-shadow: inset 0 0 0 1px rgba(34,211,238,0.35); }
      .lab-chip.active .lm { color: #9ad9e6; }
      .lab-msgs { display: flex; flex-direction: column; gap: 4px; max-height: 52vh; min-height: 120px; overflow-y: auto; padding: 4px 2px; margin-bottom: 12px; }
      .lab-msg { max-width: 84%; border-radius: 14px; padding: 9px 13px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; margin-top: 6px; }
      .lab-msg.user { align-self: flex-end; background: linear-gradient(135deg, rgba(34,211,238,0.22), rgba(96,165,250,0.18)); border: 1px solid rgba(34,211,238,0.3); }
      .lab-msg.bot { align-self: flex-start; background: #13131c; border: 1px solid #23232f; }
      .lab-msg.err { align-self: flex-start; background: #2a1518; border: 1px solid #57262c; color: #ffb3b3; }
      .lab-meta { align-self: flex-start; font-size: 10.5px; color: #6f6f7e; padding-left: 4px; }
      .lab-input { width: 100%; min-height: 62px; resize: vertical; padding: 11px 13px; border-radius: 12px; border: 1px solid #2a2a38; background: #13131c; color: #fff; font-size: 13.5px; font-family: inherit; }
      .lab-cursor::after { content: '▍'; color: var(--ember); animation: apulse 1s ease-in-out infinite; }
      .lab-ping { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: #1b1b27; color: #aab; white-space: nowrap; }
      .lab-ping.ok { color: #36d399; box-shadow: inset 0 0 0 1px rgba(54,211,153,0.35); }
      .lab-ping.bad { color: #ff8a8a; box-shadow: inset 0 0 0 1px rgba(255,107,107,0.35); }
      /* Per-lane health dot on the chips: grey = unknown, green = fast, amber = slow, red = failing. */
      .lab-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4a4a5a; margin-right: 6px; vertical-align: 1px; }
      .lab-dot.ok { background: #36d399; box-shadow: 0 0 6px rgba(54, 211, 153, 0.55); }
      .lab-dot.warn { background: #f6b93b; box-shadow: 0 0 6px rgba(246, 185, 59, 0.55); }
      .lab-dot.bad { background: #ff6b6b; box-shadow: 0 0 6px rgba(255, 107, 107, 0.55); }
      .lab-ping-at { font-size: 11px; color: #6f6f7e; white-space: nowrap; }
      body.lightadm .lab-chip { background: #fff; border-color: #d5d7e2; color: #4a4a60; }
      body.lightadm .lab-chip .lm { color: #6f6f86; }
      body.lightadm .lab-chip.active { color: #0a6c80; }
      body.lightadm .lab-chip.active .lm { color: #0e7490; }
      body.lightadm .lab-msg.bot { background: #fff; border-color: #dfe1ea; }
      body.lightadm .lab-msg.err { background: #ffe4e8; border-color: #f0b6c0; color: #8f2430; }
      body.lightadm .lab-meta { color: #6f6f86; }
      body.lightadm .lab-ping { background: #e8eaf2; color: #4a4a60; }
      body.lightadm .lab-ping.ok { color: #0c7a4d; }
      body.lightadm .lab-ping.bad { color: #b23742; }
      body.lightadm .lab-dot { background: #b7b7c6; }
      body.lightadm .lab-dot.ok { background: #16a34a; }
      body.lightadm .lab-dot.warn { background: #d97706; }
      body.lightadm .lab-dot.bad { background: #dc2626; }
      body.lightadm .lab-ping-at { color: #6f6f86; }
      body.lightadm .lab-input { background: #fff; color: #111; border-color: #d5d7e2; }
      @media print {
        nav, header, footer, #stale { display: none !important; }
        body { background: #fff !important; color: #000 !important; }
        .card { border-color: #bbb; break-inside: avoid; }
        main { max-width: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #view.enter > *, .bfill, .day .col { animation: none !important; }
        .card { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="login" class="login">
      <h2>VinaX Admin</h2>
      <p>Enter the admin token to open the dashboards.</p>
      <input id="token" type="password" placeholder="Admin token" autocomplete="off" />
      <div class="row" style="justify-content: center; margin-top: 14px"><button id="enter">Open</button></div>
      <div id="loginErr" class="err"></div>
    </div>

    <div id="app" hidden>
      <header>

        <div class="spacer"></div>
        <div class="seg" id="range" hidden></div>
        <label class="switch" id="autoWrap"><span class="track on" id="autoTrack"><span class="knob"></span></span> Auto-refresh</label>
        <button class="ghost" id="csv" hidden>⬇ CSV</button>
        <button class="ghost" id="json" title="Download this panel as JSON">{ }</button>
        <button class="ghost" id="report" title="Copy a day report to the clipboard">📋</button>
        <button class="ghost" id="notify" title="Browser alert when new errors appear">🔔</button>
        <button class="ghost" id="theme" title="Light / dark">◐</button>
        <button class="ghost" id="refresh">↻</button>
        <button class="ghost" id="logout">Sign out</button>
      </header>
      <div id="stale" class="stale" hidden>⚠ Data looks stale — refresh may be failing.</div>
      <div class="layout">
        <nav id="nav">
          <input id="navSearch" class="nav-search" type="search" placeholder="Search sections… (⌘K)" aria-label="Filter sections" />
          <div class="nav-group-label" data-group>Overview</div>
          <button data-sec="overview" class="active">Overview</button>
          <button data-sec="realtime">Real-Time</button>
          <div class="nav-group-label" data-group>Listeners</div>
          <button data-sec="live">Live Listening</button>
          <button data-sec="activity">Activity Feed</button>
          <button data-sec="engagement">Engagement</button>
          <button data-sec="users">User Management</button>
          <div class="nav-group-label" data-group>Content</div>
          <button data-sec="songs">Song Management</button>
          <button data-sec="playlists">Playlist Management</button>
          <button data-sec="homescreen">Home Screen Management</button>
          <button data-sec="categories">Categories &amp; Genres</button>
          <button data-sec="content">Content Control</button>
          <button data-sec="banners">Banner &amp; Promotion</button>
          <div class="nav-group-label" data-group>Analytics</div>
          <button data-sec="music">Music Analytics</button>
          <button data-sec="location">Location Analytics</button>
          <button data-sec="world">🌍 World</button>
          <button data-sec="search">Search Analytics</button>
          <button data-sec="insights">Insights</button>
          <div class="nav-group-label" data-group>Operations</div>
          <button data-sec="technical">Technical</button>
          <button data-sec="ai">AI Monitoring</button>
          <button data-sec="ailab">API Monitoring</button>
          <button data-sec="feedback">Feedback</button>
          <button data-sec="notify2">Notifications</button>
          <button data-sec="rooms">Live Rooms</button>
          <div class="nav-group-label" data-group>Configuration</div>
          <button data-sec="config">App Configuration</button>
        </nav>
        <main>
          <div class="toolbar"><h2 id="secTitle">Live Listening</h2><div class="spacer"></div><span class="updated" id="updated">—</span></div>
          <div id="view"><div class="empty">Loading…</div></div>
        </main>
      </div>
      <footer>token-gated · coarse, anonymous data only</footer>
    </div>

    <div id="modal" class="modal" hidden><div class="box" id="modalBody"></div></div>

    <script src="/admin/app.js"></script>
  </body>
</html>
