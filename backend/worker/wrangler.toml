# VinaX backend — Cloudflare Worker configuration.
# Deploy: npx wrangler deploy --config worker/wrangler.toml
name = "vinax-api"
main = "index.ts"
compatibility_date = "2026-08-01"


# Same-zone routes: the Worker answers exactly these paths on the production
# domain; everything else is served by the Pages project attached to the
# domain (which must stay attached — it is the fallthrough origin).
routes = [
  # API — all endpoints, including /api/cat/* (self-hosted catalog),
  # /api/admin/*, /api/cron/*, /api/push/*
  { pattern = "www.vinaxmusic.online/api/*", zone_name = "vinaxmusic.online" },

  # 11.0.3 — the apex (vinaxmusic.online/*) is NOT a Worker route any more.
  # It was a catch-all only so _middleware could 301 it to www, which made the
  # apex's robots.txt depend on the Worker's daily quota: once the quota ran out
  # (error 1027) every apex URL, robots.txt included, answered 429, and Google
  # stopped crawling the whole domain ("Robots.txt unreachable", site-wide).
  # The static host does the same 301 for free and without a limit:
  # `https://vinaxmusic.online/*  https://www.vinaxmusic.online/:splat 301`
  # in frontend/public/_redirects (the apex is attached to the Pages project).
  # Do not add the apex back — nothing on it needs the Worker.

  # 11.0.2 — /song/*, /album/*, /artist/* and /playlist/* are NOT Worker
  # routes any more. They are served by the static host as the ordinary app
  # (`/*  /index.html  200` in frontend/public/_redirects), which is free and
  # has no daily request limit. Since 2026-10-04 a scraper rotating thousands
  # of IPv6 addresses fetched these pages around the clock: ~98% of the Worker's
  # requests, the free daily quota gone within hours of each reset, and every
  # /api/* call failing for real listeners for the rest of the day. A routed
  # request is counted before any code runs, so only removing the route stops
  # that. The cost: crawlers and link previewers get the app shell, not the
  # pre-rendered song text and share card. The handlers in functions/song,
  # album, artist and playlist stay in the code; to bring the pages back, put
  # the four patterns here again — and put a challenge rule in front of them
  # first (docs/operations.md, "Scraper traffic on entity pages").

  # V2 1.0 — /sitemap* is NOT a Worker route any more. The sitemap index,
  # sitemap-static.xml and sitemap-hubs.xml are static files the frontend
  # build writes from these same handlers (frontend/scripts/
  # prerender-entities.mjs), next to entity-pages.xml. Retired maps 301 to
  # the index in frontend/public/_redirects. A crawler re-reading the maps
  # costs nothing from the daily request quota.

  # Image proxy + APK download
  { pattern = "www.vinaxmusic.online/img", zone_name = "vinaxmusic.online" },
  { pattern = "www.vinaxmusic.online/apk", zone_name = "vinaxmusic.online" },

  # Host-level redirects handled by functions/_middleware.ts
  { pattern = "update.vinaxmusic.online/*", zone_name = "vinaxmusic.online" },
  { pattern = "admin.vinaxmusic.online/", zone_name = "vinaxmusic.online" },
  # Admin dashboard API (the admin SPA calls /api/* on its own host)
  { pattern = "admin.vinaxmusic.online/api/*", zone_name = "vinaxmusic.online" },

  # V2 1.0 — the 72 mood × language hubs (/<lang>-<mood>-songs) are NOT
  # Worker routes any more: the frontend build renders them with
  # functions/_lib/render.ts renderHub and the static host serves them as
  # plain files (dist/<lang>-<mood>-songs.html), with the same words, song
  # lists, canonical and JSON-LD. A crawler walked those 72 every day; now
  # the Worker's quota is left for listeners (/api/*). functions/[hub].ts
  # stays in the code for local runs and the tests.
]

# 14.0 — the scheduled jobs (worker/functions/_lib/jobs.ts): every 30 minutes
# the status tick probes the public components; once an hour housekeeping
# sweeps idle rooms, purges old usage events and retires silent push devices.
# Nothing runs without the database secrets.
[triggers]
crons = ["*/30 * * * *"]

[vars]
# Host of the Pages deployment serving the static frontend.
ASSETS_HOST = "vinax.pages.dev"
GITHUB_REPO = "Vinay1812007/VinaX"
# 12.2 — optional Google sign-in: the public web OAuth client id of the
# "VinaX Music" project (comma-separate several). Not a secret. Sessions are
# signed with the AUTH_SECRET secret (else DEVICE_ID_SECRET).
GOOGLE_CLIENT_ID = "152181244509-biv1p3bge1endo5pd8qpc1ormhb4a75l.apps.googleusercontent.com"

# Secrets (set with `npx wrangler secret put <NAME> --config worker/wrangler.toml`
# or the Workers dashboard, never in this file) — every name documented in
# .env.example now lives on this Worker instead of the Pages project.
# One-time encrypted device-handoff links (worker/functions/api/handoff.ts).
[[kv_namespaces]]
binding = "HANDOFF"
id = "34a611e441644d0b9eb77cbbe584a766"

# Workers Rate Limiting (7.2.0) — see worker/functions/_lib/ratelimit.ts.
# Counters are shared by every isolate in ONE Cloudflare location (not
# global), permissive and eventually consistent. Each tier is "requests per
# 60 s per key"; a route uses the smallest tier at or above its in-memory
# bucket's capacity + one minute of refill, keyed `route|hash(client ip)`.
# namespace_id is a number chosen here (unique within the account; two
# bindings sharing one share counters) — nothing is created ahead of deploy.
# Without these bindings (tests, `wrangler dev` without them) the in-memory
# limiter is the whole limiter.
[[ratelimits]]
name = "RATE_LIMIT_10"
namespace_id = "7201"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_30"
namespace_id = "7202"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_60"
namespace_id = "7203"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_300"
namespace_id = "7204"
simple = { limit = 300, period = 60 }

# Wrong admin tokens per source per location (_lib/admin.ts isAdminAsync):
# past 15 in a minute, each isolate that sees the source locks it for 10 min.
[[ratelimits]]
name = "ADMIN_AUTH_FAILS"
namespace_id = "7205"
simple = { limit = 15, period = 60 }

[observability]
enabled = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
