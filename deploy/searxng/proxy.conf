# VinaX web search — reverse proxy (mounted as the proxy container's config).
#
# - Serves https://{$SEARXNG_HOSTNAME} with an automatically issued and
#   renewed certificate (ports 80 and 443 must reach this machine).
# - Forwards ONLY /search and /healthz, and only when the request carries
#   `Authorization: Bearer {$SEARXNG_TOKEN}` — the header the VinaX Worker
#   sends. Everything else gets 401 (or 404), so strangers cannot use the
#   instance. The token is removed before the request reaches SearXNG.
# - Use a hex token (openssl rand -hex 32): it is compared as an exact string.

{$SEARXNG_HOSTNAME} {
	encode gzip

	@vinax {
		method GET
		path /search /healthz
		header Authorization "Bearer {$SEARXNG_TOKEN}"
	}

	handle @vinax {
		request_header -Authorization
		reverse_proxy searxng:8080
	}

	handle /search {
		respond "Unauthorized" 401
	}

	handle {
		respond "Not found" 404
	}

	header {
		-Server
		X-Robots-Tag "noindex, nofollow"
		Referrer-Policy "no-referrer"
	}

	log {
		output stdout
		format console
	}
}
