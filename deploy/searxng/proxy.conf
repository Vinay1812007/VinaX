# VinaX web search — reverse proxy (mounted as the proxy container's config).
#
# - Serves {$SEARXNG_SITE_ADDRESS}: by default the hostname itself, i.e.
#   https://{$SEARXNG_HOSTNAME} with an automatically issued and renewed
#   certificate (ports 80 and 443 must reach this machine). In tunnel mode
#   (docker-compose.tunnel.yml) it is plain http on :8888 inside the stack and
#   the Cloudflare Tunnel connector brings the traffic in — no open ports.
# - Forwards ONLY /search and /healthz, and only when the request carries
#   `Authorization: Bearer {$SEARXNG_TOKEN}` — the header the VinaX Worker
#   sends. Everything else gets 401 (or 404), so strangers cannot use the
#   instance. The token is removed before the request reaches SearXNG.
# - Use a hex token (openssl rand -hex 32): it is compared as an exact string.
#   While rotating, SEARXNG_TOKEN_PREVIOUS (the old token) is accepted too;
#   docker-compose.yml sets it to the current token when it is unset.
# - The access log never records the search words: the `q` query parameter is
#   deleted from every logged request (Authorization is never logged either).

{$SEARXNG_SITE_ADDRESS} {
	encode gzip

	@vinax {
		method GET
		path /search /healthz
		# Two values of one header field are OR'd: the current token, or the previous one during a rotation.
		header Authorization "Bearer {$SEARXNG_TOKEN}"
		header Authorization "Bearer {$SEARXNG_TOKEN_PREVIOUS}"
	}

	handle @vinax {
		request_header -Authorization
		reverse_proxy searxng:8080
	}

	handle /search {
		respond "Unauthorized" 401
	}

	handle {
		respond "Not found" 404
	}

	header {
		-Server
		X-Robots-Tag "noindex, nofollow"
		Referrer-Policy "no-referrer"
	}

	log {
		output stdout
		format filter {
			wrap console
			fields {
				request>uri query {
					delete q
				}
			}
		}
	}
}
