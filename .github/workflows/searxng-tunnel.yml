# Give the owner's web search instance a permanent address, from GitHub.
#
# VinaX's web search (VinaX AI research answers, the Search-page music
# expert, fresh DJ / playlist discoveries, the `web` trends source) calls the
# owner's own SearXNG instance at SEARXNG_URL. A quick `trycloudflare.com`
# tunnel gets a new random address every time it restarts, so the Worker's
# SEARXNG_URL goes stale (Cloudflare answers 530) — this workflow replaces it
# with a named, remotely-managed Cloudflare Tunnel on the owner's own domain:
#
#   1. find or create the tunnel `vinax-search` (config lives in Cloudflare);
#   2. route https://<hostname> through it to <service> (default
#      http://localhost:8888, the instance on the machine running the tunnel);
#   3. point a proxied DNS CNAME <hostname> → <tunnel-id>.cfargotunnel.com;
#   4. set the Worker secret SEARXNG_URL = https://<hostname>.
#
# It never prints the tunnel's connector token. To run the connector on the
# machine that hosts SearXNG, copy the install command from the Cloudflare
# dashboard (Zero Trust → Networks → Tunnels → vinax-search → Configure) —
# `sudo cloudflared service install <token>` keeps it running across reboots.
#
# The CLOUDFLARE_API_TOKEN secret needs, besides the Workers permissions the
# deploy uses: Account · Cloudflare Tunnel · Edit, Zone · DNS · Edit and
# Zone · Zone · Read (for the zone that holds <hostname>).
#
# Safe to re-run: every step finds what already exists and updates it.
#
# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: Web search tunnel

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Public address for the web search instance'
        type: string
        default: 'search.sirimillavinay.online'
      service:
        description: 'Where the tunnel connector reaches SearXNG'
        type: string
        default: 'http://localhost:8888'
      set_worker_url:
        description: 'Also set the Worker secret SEARXNG_URL to https://<hostname>'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: searxng-tunnel
  cancel-in-progress: false

env:
  TUNNEL_NAME: vinax-search
  CF_API: https://api.cloudflare.com/client/v4

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check inputs and secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOST: ${{ inputs.hostname }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -eu
          [ -n "$TOKEN" ] || { echo "::error::The CLOUDFLARE_API_TOKEN secret is not set."; exit 1; }
          [ -n "$ACCOUNT" ] || { echo "::error::The CLOUDFLARE_ACCOUNT_ID secret is not set."; exit 1; }
          echo "$HOST" | grep -Eq '^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$' \
            || { echo "::error::hostname must be a plain lower-case DNS name such as search.example.org (no scheme, no slash)."; exit 1; }
          echo "$SERVICE" | grep -Eq '^https?://[A-Za-z0-9.:-]+/?$' \
            || { echo "::error::service must look like http://localhost:8888"; exit 1; }
          curl -fsS -H "Authorization: Bearer $TOKEN" "$CF_API/user/tokens/verify" | jq -e '.success' > /dev/null \
            || { echo "::error title=Cloudflare token rejected::CLOUDFLARE_API_TOKEN is invalid or expired — create a new one and update the secret."; exit 1; }
          EXPIRES="$(curl -fsS -H "Authorization: Bearer $TOKEN" "$CF_API/user/tokens/verify" | jq -r '.result.expires_on // empty')"
          if [ -n "$EXPIRES" ]; then
            echo "::warning title=Cloudflare token expires::CLOUDFLARE_API_TOKEN expires on $EXPIRES. After that the Worker deploy and this workflow stop working until the secret is replaced."
          fi

      - name: Find or create the tunnel
        id: tunnel
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }
          fail() { echo "::error title=$1::$2"; echo "$3" | jq -c '.errors // .' 2>/dev/null || true; exit 1; }
          LIST="$(api "$CF_API/accounts/$ACCOUNT/cfd_tunnel?name=$TUNNEL_NAME&is_deleted=false")"
          echo "$LIST" | jq -e '.success' > /dev/null \
            || fail 'Tunnels could not be listed' 'The token needs Account · Cloudflare Tunnel · Edit for this account.' "$LIST"
          ID="$(echo "$LIST" | jq -r '.result[0].id // empty')"
          if [ -z "$ID" ]; then
            MADE="$(api -X POST "$CF_API/accounts/$ACCOUNT/cfd_tunnel" --data "{\"name\":\"$TUNNEL_NAME\",\"config_src\":\"cloudflare\"}")"
            echo "$MADE" | jq -e '.success' > /dev/null || fail 'Tunnel not created' 'Cloudflare refused to create the tunnel.' "$MADE"
            ID="$(echo "$MADE" | jq -r '.result.id')"
            echo "Created tunnel $TUNNEL_NAME ($ID)."
          else
            echo "Reusing tunnel $TUNNEL_NAME ($ID)."
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Route the hostname through the tunnel
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ID: ${{ steps.tunnel.outputs.id }}
          HOST: ${{ inputs.hostname }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -eu
          BODY="$(jq -n --arg host "$HOST" --arg svc "$SERVICE" \
            '{config: {ingress: [{hostname: $host, service: $svc}, {service: "http_status:404"}]}}')"
          OUT="$(curl -sS -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            "$CF_API/accounts/$ACCOUNT/cfd_tunnel/$ID/configurations" --data "$BODY")"
          echo "$OUT" | jq -e '.success' > /dev/null \
            || { echo "::error title=Tunnel route not saved::Cloudflare refused the tunnel configuration."; echo "$OUT" | jq -c '.errors'; exit 1; }
          echo "https://$HOST → $SERVICE (through $TUNNEL_NAME)."

      - name: Point DNS at the tunnel
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ID: ${{ steps.tunnel.outputs.id }}
          HOST: ${{ inputs.hostname }}
        run: |
          set -eu
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }
          # The zone is the longest suffix of the hostname that the token can see.
          ZONE_ID=""
          CANDIDATE="$HOST"
          while [ -z "$ZONE_ID" ] && echo "$CANDIDATE" | grep -q '\.'; do
            ZONE_ID="$(api "$CF_API/zones?name=$CANDIDATE" | jq -r '.result[0].id // empty')"
            [ -n "$ZONE_ID" ] || CANDIDATE="${CANDIDATE#*.}"
          done
          [ -n "$ZONE_ID" ] || { echo "::error title=Zone not found::No zone for $HOST is visible to this token. Add Zone · Zone · Read and Zone · DNS · Edit for that zone to CLOUDFLARE_API_TOKEN."; exit 1; }
          TARGET="$ID.cfargotunnel.com"
          RECORD="$(jq -n --arg name "$HOST" --arg target "$TARGET" \
            '{type: "CNAME", name: $name, content: $target, proxied: true, comment: "VinaX web search tunnel"}')"
          EXISTING="$(api "$CF_API/zones/$ZONE_ID/dns_records?name=$HOST")"
          echo "$EXISTING" | jq -e '.success' > /dev/null \
            || { echo "::error title=DNS not readable::Add Zone · DNS · Edit for this zone to CLOUDFLARE_API_TOKEN."; echo "$EXISTING" | jq -c '.errors'; exit 1; }
          REC_ID="$(echo "$EXISTING" | jq -r '.result[0].id // empty')"
          REC_TYPE="$(echo "$EXISTING" | jq -r '.result[0].type // empty')"
          if [ -n "$REC_ID" ] && [ "$REC_TYPE" != "CNAME" ]; then
            echo "::error title=Address already in use::$HOST already has a $REC_TYPE record. Remove it or choose another hostname."; exit 1
          fi
          if [ -n "$REC_ID" ]; then
            OUT="$(api -X PUT "$CF_API/zones/$ZONE_ID/dns_records/$REC_ID" --data "$RECORD")"
          else
            OUT="$(api -X POST "$CF_API/zones/$ZONE_ID/dns_records" --data "$RECORD")"
          fi
          echo "$OUT" | jq -e '.success' > /dev/null \
            || { echo "::error title=DNS record not saved::Add Zone · DNS · Edit for this zone to CLOUDFLARE_API_TOKEN."; echo "$OUT" | jq -c '.errors'; exit 1; }
          echo "$HOST → $TARGET (proxied)."

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: inputs.set_worker_url
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set SEARXNG_URL on the Worker
        if: inputs.set_worker_url
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOST: ${{ inputs.hostname }}
        run: |
          set -eu
          npm ci --no-audit --no-fund
          printf '%s' "https://$HOST" | npx wrangler secret put SEARXNG_URL --config worker/wrangler.toml
          echo "SEARXNG_URL = https://$HOST"

      - name: Check the address
        env:
          HOST: ${{ inputs.hostname }}
        run: |
          set -u
          # The connector may not be running yet (it runs on the machine that
          # hosts SearXNG), so this is a report, not a gate.
          CODE="$(curl -s -o /tmp/probe -w '%{http_code}' --max-time 20 "https://$HOST/search?q=telugu+songs&format=json" || echo 000)"
          TYPE="$(head -c 1 /tmp/probe 2>/dev/null || true)"
          if [ "$CODE" = "200" ] && [ "$TYPE" = "{" ]; then
            echo "::notice title=Web search is reachable::https://$HOST answers JSON."
          else
            echo "::notice title=Start the connector::https://$HOST answered HTTP $CODE. On the machine running SearXNG, install the connector from the dashboard (Zero Trust → Networks → Tunnels → $TUNNEL_NAME → Configure) — e.g. 'sudo cloudflared service install <token>' — then re-check System health in the owner console."
          fi
