# VinaX CLI — the terminal agent runs on the developer's own machine, so it is
# tested on all three of them. A dedicated workflow rather than widening ci.yml:
# there is no reason to run the whole frontend and backend matrix three times.
#
# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'backend/worker/functions/_lib/cli*'
      - 'backend/worker/functions/api/vinaxcli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'backend/worker/functions/_lib/cli*'
      - 'backend/worker/functions/api/vinaxcli/**'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

jobs:
  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Before the tests, not after: the end-to-end suite drives the compiled
      # binary at dist/cli.js, so a missing build is a failing suite.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package contents
        run: npm pack --dry-run

      # Windows has no process groups and no POSIX signals, so path handling
      # and child-process cleanup behave differently there. Name the suites
      # explicitly so a Windows-only regression is obvious in the run summary.
      - name: Windows path and process behaviour
        if: runner.os == 'Windows'
        run: npx vitest run tests/security.test.ts tests/filesystem.test.ts tests/process.test.ts

      - name: Smoke the built binary
        run: node dist/cli.js --version && node dist/cli.js --help
