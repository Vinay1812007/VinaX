# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: Trending headlines

# Pings the protected cron endpoint, which refreshes the "Trending now"
# headlines on the empty VinaX AI chat (backend/worker/functions/_lib/headlines.ts):
# one web search per topic (India news, tech), stored once for everyone.
# Eight runs a day = at most 16 searches, and none once today's searches reach
# 75 % of SERPER_DAILY_LIMIT or the owner switches web-search off (the
# endpoint answers { ok: true, skipped } then). Set the CRON_SECRET repository
# secret to match the Worker's CRON_SECRET.
on:
  schedule:
    - cron: '23 */3 * * *' # every three hours at :23 UTC, away from the other jobs
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Refresh headlines
        # One call only: a retry could spend two more searches. A missed run
        # is harmless — the strip keeps the last headlines for a day.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST "https://www.sirimillavinay.online/api/cron/headlines" \
            -H "x-cron-secret: ${CRON_SECRET}" --max-time 60 || echo 000)
          # The answer is untrusted text in this log: one line, no "::" commands.
          tr -d '\r\n' < body.json 2>/dev/null | sed 's/::/: :/g' | cut -c1-300; echo
          if [ "$code" != "200" ]; then
            echo "headlines endpoint answered $code"
            exit 1
          fi

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "cron trending headlines failed" \
            --body "The scheduled headlines workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
