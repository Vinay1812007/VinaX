# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: Build Android APK

# Runs by dispatch only: the Auto release workflow dispatches it on every
# merge to main once the release commit (the version bump) has landed, so a
# merge produces ONE signed APK and ONE GitHub Release that carry the new
# version. A push trigger here would build the old version first.
on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail when the signing keystore is missing (a hand-run release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Compute versionCode from a workflow-specific base to keep buildapk and
      # release.yml on disjoint ranges. buildapk uses 1000 + run_number, release
      # uses 1000000 + run_number, so their versionCodes never collide or
      # regress (audit finding H-OPS-2).
      - name: Compute versionCode
        run: |
          BUILD_VERSION_CODE_BASE=1000
          echo "BUILD_VERSION_CODE_BASE=$BUILD_VERSION_CODE_BASE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((BUILD_VERSION_CODE_BASE + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }

      - name: Install JS deps
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build web bundle
        env:
          # MUST match the APK's versionCode (BASE + run_number), NOT the raw
          # run number — this feeds checkForUpdate's JS fallback comparison.
          VITE_BUILD_NUMBER: ${{ env.VERSION_CODE }}
        run: npm run build

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: "temurin", java-version: "21" }

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default is "tools platform-tools"; the legacy "tools"
          # package was removed from the SDK repository and sdkmanager now
          # exits 1 on it ("Failed to find package 'tools'"), failing every
          # build before Gradle starts (2026-09-16). Gradle fetches the
          # build-tools and platform it needs on its own.
          packages: platform-tools

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android project (Native Integration)
        run: node scripts/patch-android.js

      - name: Set versionCode + versionName + minSdk
        run: |
          BUILD=android/app/build.gradle
          VC=${VERSION_CODE:-1}
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]\+/versionCode $VC/" "$BUILD"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VN\"/" "$BUILD"

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Use a stable debug keystore (consistent app signature across builds)
        run: |
          mkdir -p ~/.android
          base64 -d ci/debug-keystore.b64 > ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mkdir -p out && cp android/app/build/outputs/apk/debug/app-debug.apk out/vinax-debug.apk

      - name: Upload debug APK artifact
        # Storage-quota safe: short retention, and a full quota must not fail the build
        # (the APK is still published to the GitHub Release below).
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vinax-debug-apk
          path: frontend/out/vinax-debug.apk
          retention-days: 2

      # ---- Release path (only when publishing) ----------------------------------
      # Everything below this line only matters when the workflow is going to
      # PUBLISH a release. On ordinary pushes to main we just want the debug
      # artifact and to stop — the sign+publish steps would otherwise error
      # out on repos that haven't configured ANDROID_KEYSTORE_BASE64 yet, which
      # is a false failure (release publish is already gated behind [release]).

      - name: Decide whether this run publishes a release
        id: rel
        # Publish a fresh signed APK on EVERY run (owner request: "release
        # the app every time the code updates"); Auto release dispatches one
        # per merge. A hand run with `strict`, or a [release] commit, is
        # EXPLICIT release intent: those FAIL loudly when the signing keystore
        # is missing, whereas the automatic run just SKIPS the publish so a
        # merge can never go red over an unconfigured keystore.
        # The commit message is passed through an env var, never pasted into
        # the script: a message with quotes or backticks (the #65 squash)
        # broke the shell ("syntax error near unexpected token `newline'") and
        # skipped the release, and a crafted one could run commands in a job
        # that holds the signing secrets.
        env:
          STRICT: ${{ inputs.strict }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          if [ "$STRICT" = "true" ] || printf '%s' "$COMMIT_MESSAGE" | grep -qF '[release]'; then
            echo "RELEASE_EXPLICIT=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_EXPLICIT=false" >> "$GITHUB_ENV"
          fi

      - name: Detect keystore availability
        if: ${{ env.IS_RELEASE == 'true' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "HAS_KEYSTORE=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_ENV"

      - name: Fail cleanly if an EXPLICIT release was requested but keystore missing
        if: ${{ env.RELEASE_EXPLICIT == 'true' && env.HAS_KEYSTORE != 'true' }}
        # Audit finding H-OPS-1: never publish a debug-signed APK as latest —
        # that ships the public debug keystore and lets anyone produce
        # update-compatible APKs. Only hard-fail on EXPLICIT release intent;
        # auto-releases skip instead (next step).
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 missing on this repo."
          echo "::error::Add all four ANDROID_KEYSTORE_* secrets under Settings → Secrets and variables → Actions."
          echo "::error::See SETUP.md (delivered separately) for the values already generated for this repo."
          exit 1

      - name: Note when an auto-release is skipped for a missing keystore
        if: ${{ env.RELEASE_EXPLICIT != 'true' && env.HAS_KEYSTORE != 'true' }}
        run: echo "::notice::Auto-release skipped — ANDROID_KEYSTORE_BASE64 not set. The debug APK artifact above is still available; add the four ANDROID_KEYSTORE_* secrets to publish a signed release on every push."

      - name: Decode keystore
        if: ${{ env.IS_RELEASE == 'true' && env.HAS_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks

      - name: Build signed release APK
        if: ${{ env.IS_RELEASE == 'true' && env.HAS_KEYSTORE == 'true' }}
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Prepare release assets
        if: ${{ env.IS_RELEASE == 'true' && env.HAS_KEYSTORE == 'true' }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk vinax.apk
          sha256sum vinax.apk | awk '{print $1}' > vinax.apk.sha256

      - name: Publish GitHub Release (auto-update source)
        if: ${{ env.IS_RELEASE == 'true' && env.HAS_KEYSTORE == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Tag carries the real Android versionCode. The old form used the
          # raw run_number while the APK carried BASE+run_number, so
          # /api/version reported a build every installed device already
          # "exceeded" — in-app updates never fired (see functions/api/version.ts).
          tag_name: v${{ env.APP_VERSION }}-build${{ env.VERSION_CODE }}
          name: VinaX v${{ env.APP_VERSION }} (build ${{ env.VERSION_CODE }})
          make_latest: true
          files: |
            frontend/vinax.apk
            frontend/vinax.apk.sha256
          body: |
            Automated build of VinaX.
            Version: ${{ env.APP_VERSION }}
            VersionCode: ${{ env.VERSION_CODE }}
            Signed: ${{ env.HAS_KEYSTORE }}

            Install this APK over your existing version to update.
