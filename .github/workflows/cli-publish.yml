# Publish vinax-cli to the public npm registry.
#
# Deliberately separate from cli.yml: normal CI runs on every push and pull
# request, and nothing about an ordinary commit should be able to publish a
# package. This runs ONLY on a `vinax-cli-v*` tag.
#
# It also refuses to publish a tag that disagrees with the package. A release
# tagged v0.1.1 that ships 0.1.0 is worse than no release at all — npm would
# accept it and every later diagnosis would start from a false premise.
#
# Authentication is npm Trusted Publishing (OIDC): no NPM_TOKEN is stored in
# this repository, and `--provenance` gives the published package a verifiable
# link back to this workflow and commit.
#
# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: Publish CLI

on:
  push:
    tags:
      - 'vinax-cli-v*'
  # Lets a maintainer rehearse every gate without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run all gates and stop before publishing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC) and provenance.
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm; the one bundled with Node 22 is
      # older than the OIDC support.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Check the tag matches the package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/vinax-cli-v}"
          PKG="$(node -p "require('./package.json').version")"
          SRC="$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/CLI_VERSION = '([^']+)'/)[1]")"
          echo "tag=$TAG  package.json=$PKG  CLI_VERSION=$SRC"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRC" ]; then
            echo "::error::Version mismatch — tag $TAG, package.json $PKG, CLI_VERSION $SRC. Refusing to publish."
            exit 1
          fi

      - name: Refuse to republish a version that already exists
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if npm view "vinax-cli@$PKG" version >/dev/null 2>&1; then
            echo "::error::vinax-cli@$PKG is already on the registry. Bump the version instead of forcing a republish."
            exit 1
          fi
          echo "vinax-cli@$PKG is not yet published — proceeding."

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package contents
        run: npm pack --dry-run

      - name: Smoke the built binary
        run: node dist/cli.js --version && node dist/cli.js --help

      # Install the exact tarball into a throwaway prefix and run it. The thing
      # that failed in production was the INSTALL, so the last gate before
      # publishing is an install.
      - name: Install the tarball and run the installed binary
        run: |
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/$TARBALL"
          "$RUNNER_TEMP/prefix/bin/vinax" --version
          "$RUNNER_TEMP/prefix/bin/vinax" --help > /dev/null

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: npm publish --access public --provenance

      - name: Verify the registry actually has it
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: |
          PKG="$(node -p "require('./package.json').version")"
          # The registry is not instantly consistent; give it a few tries
          # rather than declaring failure on the first miss.
          for i in 1 2 3 4 5 6; do
            if [ "$(npm view "vinax-cli@$PKG" version 2>/dev/null)" = "$PKG" ]; then
              echo "vinax-cli@$PKG is live on the registry."
              npm view "vinax-cli@$PKG" bin engines dist-tags
              exit 0
            fi
            echo "not visible yet (attempt $i) — waiting"
            sleep 10
          done
          echo "::error::vinax-cli@$PKG did not appear on the registry after publishing."
          exit 1

      - name: Install from the PUBLIC registry, as a user would
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        run: |
          PKG="$(node -p "require('./package.json').version")"
          npm install -g --prefix "$RUNNER_TEMP/public" "vinax-cli@$PKG"
          "$RUNNER_TEMP/public/bin/vinax" --version
          "$RUNNER_TEMP/public/bin/vinax" --help > /dev/null
