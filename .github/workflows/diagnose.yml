# Production hydration diagnostic (2026-08-17 incident: site stuck on the
# static shell in app + web). Fetches the live HTML, checks every referenced
# asset answers 200, then loads the page in headless Chrome WITH JavaScript
# and reports whether React actually mounted (#main-content present).
# Results are emitted as check annotations so they are readable via the API.
name: diagnose
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/diagnose.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # 14.0: is the Worker talking to its database? Three public routes say
      # so without a token. /api/username answers `unchecked` when the two
      # database secrets are missing on the Worker, 503 when they are set
      # but the database refuses, and a plain answer when a read worked.
      # /api/status carries each component's recorded history, written by
      # the Worker's 30-minute Cron Trigger (empty = no database or no tick
      # yet). /api/version is the Android update manifest (GITHUB_TOKEN).
      - name: database and update manifest (14.0)
        run: |
          OUT=$(curl -s -m 15 -o /tmp/u.json -w '%{http_code}' 'https://www.vinaxmusic.online/api/username?u=zz_probe_unclaimed' || echo ERR)
          BODY=$(head -c 200 /tmp/u.json)
          case "$OUT $BODY" in
            200*unchecked*) echo "::error title=database::NOT CONFIGURED - the Worker has no SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY (docs/database.md#setting-it-up). $BODY";;
            200*)           echo "::notice title=database::OK - a read answered ($BODY)";;
            503*)           echo "::error title=database::UNREACHABLE - secrets are set but the database refused or timed out ($OUT $BODY)";;
            *)              echo "::error title=database::unexpected answer $OUT $BODY";;
          esac
          curl -s -m 15 -o /tmp/s.json 'https://www.vinaxmusic.online/api/status' || true
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/s.json'))
              comps = d.get('components') or []
              hist = [c for c in comps if c.get('days')]
              down = [c['id'] for c in comps if c.get('status') != 'up']
              print(f"::notice title=status::overall={d.get('overall')} components={len(comps)} with-history={len(hist)} down={down}")
              if comps and not hist:
                  print("::warning title=status-history::no component has recorded history: the Cron Trigger has not written an uptime tick to the database yet (or cannot)")
          except Exception as e:
              print(f"::error title=status::could not parse /api/status: {e}")
          PY
          OUT=$(curl -s -m 15 -o /tmp/v.json -w '%{http_code}' 'https://www.vinaxmusic.online/api/version' || echo ERR)
          echo "::notice title=version::$OUT $(head -c 300 /tmp/v.json)"
          [ "$OUT" = "200" ] || echo "::error title=version::the Android update manifest did not answer 200 - installed apps cannot see new releases (GITHUB_TOKEN / GITHUB_REPO on the Worker)"

      # 14.0.4 — are the providers out of the app and behind the secret?
      - name: catalogue secret and bundle hygiene (14.0.4)
        run: |
          H=$(curl -s -D - -o /tmp/cat.json -m 20 'https://www.vinaxmusic.online/api/cat/search/songs?query=telugu&limit=1')
          SRC=$(printf '%s' "$H" | tr -d '\r' | grep -i '^x-vinax-source:' | awk '{print $2}')
          if [ "$SRC" = "upstream" ]; then echo "::notice title=catalogue-secret::OK - CATALOG_UPSTREAMS is set; a configured wrapper answered"; else echo "::warning title=catalogue-secret::CATALOG_UPSTREAMS is not set (or every wrapper failed): the built-in JioSaavn translation answered. Set it: npx wrangler secret put CATALOG_UPSTREAMS --config worker/wrangler.toml"; fi
          curl -s -m 20 https://www.vinaxmusic.online/ -o /tmp/home.html
          LEAK=0
          for u in $(grep -o 'src="/assets/[^"]*\.js"' /tmp/home.html | sed 's/src="//;s/"//'); do
            curl -s -m 30 "https://www.vinaxmusic.online$u" -o /tmp/chunk.js
            if grep -qE 'musicapi\.vinaxmusic|saavn\.sumit|nepotune|saavn\.dev|b4a\.run|jiosaavn\.com/api' /tmp/chunk.js; then echo "::error title=provider-in-bundle::$u names a music provider"; LEAK=1; fi
          done
          grep -qE 'musicapi\.vinaxmusic|saavn\.sumit|nepotune|jiosaavn\.com/api' /tmp/home.html && { echo "::error title=provider-in-html::index.html names a music provider"; LEAK=1; }
          [ "$LEAK" = 0 ] && echo "::notice title=provider-in-bundle::OK - no music provider named in index.html or its entry scripts"
          echo "::notice title=json-hosts::$(grep -oE 'https?://[a-z0-9.-]+' /tmp/cat.json | sort -u | tr '\n' ' ')"

      - name: self-hosted catalog /api/cat (4.20.0)
        run: |
          OUT=$(curl -s -m 15 -o /tmp/c.json -w '%{http_code} %{time_total}s' 'https://www.vinaxmusic.online/api/cat/search/songs?query=top%20hindi%20songs&limit=3' || echo ERR)
          SUMMARY=$(python3 -c "
          import json
          try:
            d=json.load(open('/tmp/c.json'))
            r=(d.get('data') or {}).get('results') or []
            first=r[0] if r else {}
            urls=first.get('downloadUrl') or []
            print(len(r),'results | first:',first.get('name'),'| streams:',len(urls))
          except Exception as e: print('parse-fail', e)")
          echo "::notice title=selfcat-search::$OUT | $SUMMARY"
          STREAM=$(python3 -c "
          import json
          d=json.load(open('/tmp/c.json'))
          r=(d.get('data') or {}).get('results') or []
          u=(r[0].get('downloadUrl') or []) if r else []
          print(u[2]['url'] if len(u)>2 else '')" 2>/dev/null || true)
          if [ -n "$STREAM" ]; then
            CODE=$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' "$STREAM")
            echo "::notice title=selfcat-stream::$CODE"
            FINAL=$(curl -s -L -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36' -r 0-2047 -o /dev/null -w '%{http_code} %{content_type} %{size_download}b' "$STREAM")
            echo "::notice title=selfcat-audio::$FINAL"
          else
            echo "::warning title=selfcat-stream::no stream url in first result"
          fi
      - name: same-IP auth token test (is the signature IP-bound?)
        run: |
          ENC=$(curl -s 'https://www.vinaxmusic.online/api/cat/search/songs?query=top%20hindi%20songs&limit=1' | python3 -c "
          import json,sys,urllib.parse
          d=json.load(sys.stdin)
          r=(d.get('data') or {}).get('results') or []
          u=(r[0].get('downloadUrl') or []) if r else []
          q=urllib.parse.urlparse(u[0]['url']).query if u else ''
          print(urllib.parse.parse_qs(q).get('e',[''])[0])" 2>/dev/null || true)
          if [ -n "$ENC" ]; then
            AUTH=$(curl -s -A 'Mozilla/5.0' "https://www.jiosaavn.com/api.php?__call=song.generateAuthToken&url=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$ENC")&bitrate=96&_format=json&_marker=0&api_version=4&ctx=web6dot0" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('auth_url') or (d[0].get('auth_url') if isinstance(d,list) and d else ''))" 2>/dev/null || true)
            echo "::notice title=sameip-auth::${AUTH:0:120}"
            if [ -n "$AUTH" ]; then
              R=$(curl -s -A 'Mozilla/5.0' -r 0-2047 -o /dev/null -w '%{http_code} %{content_type} %{size_download}b' "$AUTH")
              echo "::notice title=sameip-fetch::$R"
            fi
          else
            echo "::warning title=sameip::no encrypted url available"
          fi
      # 14.0.4 — the upstream list is a Worker secret; from here only the
      # self-hosted route (above) can be probed. The bases below are probed
      # only when CATALOG_PROBE_BASES (a repository variable) names them.
      - name: catalog API upstreams (2026-08-18 outage probe)
        if: vars.CATALOG_PROBE_BASES != ''
        run: |
          for base in ${{ vars.CATALOG_PROBE_BASES }}; do
            OUT=$(curl -s -m 12 -o /tmp/r.json -w '%{http_code} %{time_total}s' "$base/search/songs?query=top%20hindi%20songs&limit=3" || echo 'ERR')
            N=$(python3 -c "
          import json
          try:
            d=json.load(open('/tmp/r.json'))
            r=(d.get('data') or {}).get('results') or []
            print(len(r), '| first:', (r[0].get('name') if r else 'none'), '| hasUrl:', bool(r and (r[0].get('downloadUrl') or r[0].get('download_url') or r[0].get('media_url'))))
          except Exception as e: print('parse-fail', e)
          " 2>/dev/null)
            echo "::notice title=api-$base::$OUT | results: $N"
          done
      - name: saavncdn artwork size support (4.19.5 image-quality probe)
        run: |
          IMG=$(curl -s 'https://www.vinaxmusic.online/api/cat/search/songs?query=top%20hindi%20songs&limit=1' | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          r=(d.get('data') or {}).get('results') or []
          for v in (r[0].get('image') or []):
            u=v.get('url') or v.get('link') or ''
            if '500x500' in u: print(u); break
          " 2>/dev/null || true)
          echo "::notice title=probe-src::$IMG"
          if [ -n "$IMG" ]; then
            for s in 150x150 250x250 350x350 500x500; do
              U=$(echo "$IMG" | sed "s/500x500/$s/")
              CODE=$(curl -s -o /tmp/i.bin -w '%{http_code}' "$U"); BYTES=$(wc -c < /tmp/i.bin)
              TYPE=$(file -b --mime-type /tmp/i.bin 2>/dev/null || echo '?')
              echo "::notice title=cdn-$s::$CODE $TYPE ${BYTES}b"
            done
          else
            echo "::warning title=cdn-probe::could not obtain a sample image url"
          fi
      - name: apex host canonicalization (4.19.2)
        run: |
          for p in / /charts /moods /song/x-y; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://vinaxmusic.online$p")
            echo "::notice title=apex$p::$out"
          done
      - name: fetch shell + verify assets
        run: |
          set -e
          curl -sS -D headers.txt https://www.vinaxmusic.online/ -o home.html
          echo "::notice title=html-bytes::$(wc -c < home.html)"
          echo "::notice title=cache-headers::$(grep -i -E 'cf-cache-status|age:|cache-control' headers.txt | tr '\n' ' | ')"
          for u in $(grep -o 'src="/assets/[^"]*"' home.html | sed 's/src="//;s/"//' | head -12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.vinaxmusic.online$u")
            echo "::notice title=asset::$u -> $code"
            [ "$code" = "200" ] || echo "::error title=asset-broken::$u returned $code"
          done
          for u in $(grep -o 'href="/assets/[^"]*"' home.html | sed 's/href="//;s/"//' | head -6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://www.vinaxmusic.online$u")
            echo "::notice title=preload::$u -> $code"
            [ "$code" = "200" ] || echo "::error title=preload-broken::$u returned $code"
          done
          if grep -q 'rel="stylesheet"' home.html; then echo "::warning title=css::external stylesheet present (pre-4.18.0 shell? stale cache)"; else echo "::notice title=css::inline (4.18.x shell confirmed)"; fi
          grep -q '__vxBoot' home.html && echo "::notice title=prefetch::4.18.2 prefetch script present" || echo "::warning title=prefetch::prefetch script ABSENT (older deploy live?)"
      - name: rendered DOM after JS execution
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=25000 --dump-dom "https://www.vinaxmusic.online/" > dom.html 2> chrome.log || true
          echo "::notice title=dom-bytes::$(wc -c < dom.html)"
          # 13.0: a visitor with no account is shown the sign-in screen at /,
          # which has no #main-content. Both are React, mounted; only the
          # static shell (neither) means the app did not boot. This probe had
          # reported FAILED on every run since 13.0 for a healthy site.
          if grep -q 'id="main-content"' dom.html; then
            echo "::notice title=hydration::OK - React mounted (#main-content present)"
          elif grep -q 'id="vx-signin-title"' dom.html; then
            echo "::notice title=hydration::OK - React mounted (sign-in screen for a visitor with no account)"
          else
            echo "::error title=hydration::FAILED - static shell only after 25s virtual time"
          fi
          grep -q 'id="boot"' dom.html && echo "::warning title=boot::boot brand row still in DOM" || echo "::notice title=boot::boot row cleared"
          echo "::notice title=chrome-log::$(head -c 700 chrome.log | tr '\n' ' ')"
          # A published URL for a visitor with no account: 13.5 shows the
          # published page (PublicPage, "Listen free on VinaX") on a direct
          # load, and the live app once the visitor chooses to browse (13.9).
          # Either is React, mounted; only the static shell is a failure.
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=25000 --dump-dom "https://www.vinaxmusic.online/charts" > charts.html 2>> chrome.log || true
          if grep -q 'id="vx-public-signin-title"' charts.html; then
            echo "::notice title=published-page::OK - /charts shows the published page to a visitor with no account"
          elif grep -q 'id="main-content"' charts.html; then
            echo "::notice title=published-page::OK - /charts mounted the live app"
          else
            echo "::error title=published-page::FAILED - /charts is the static shell after 25s virtual time"
          fi
