# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: Trends ingest

# Pings the protected cron endpoint, which reads every configured trend source
# for every region in TRENDS_REGIONS, stores a snapshot, matches new items to
# catalogue songs and deletes data past its retention window (docs/trends.md).
# Set the CRON_SECRET repository secret to match the Worker's CRON_SECRET.
#
# Cadence: every six hours. One run reads one page of 50 per region at 1 quota
# unit a request (at most 3 with the endpoint's own retries, 9 if this
# workflow also retries a failing run), so four runs a day use 4 units per
# region normally and 36 at worst, against the provider's default
# 10,000-unit daily quota and the app's own ceiling
# (TRENDS_VIDEO_DAILY_UNIT_BUDGET, default 200). The chart
# does not move fast enough for more to help, the stale threshold (18 hours)
# tolerates two missed runs, and each run's catalogue matching is budgeted.
on:
  schedule:
    - cron: '17 */6 * * *' # 00:17, 06:17, 12:17, 18:17 UTC — off the hour, away from the other jobs
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trigger trends ingest
        id: ingest
        # Retry only what a retry can fix: a network error, a timeout, an edge
        # blip or a cold start (anything that is not the endpoint's own JSON
        # answer). A JSON 502 means the endpoint ran and a source failed; it
        # already retried each source with backoff, so calling it again would
        # only spend quota. Print why instead: `curl -f` used to hide the body.
        # A re-run inside the same hour is idempotent: the endpoint stores
        # nothing twice and spends no quota on a snapshot it already has.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::The CRON_SECRET repository secret is not set"
            echo "summary=The CRON_SECRET repository secret is not set." >> "$GITHUB_OUTPUT"
            exit 1
          fi
          attempt=1
          while :; do
            code=$(curl -sS -o body.json -w '%{http_code}' --max-time 120 -X POST \
              "https://www.sirimillavinay.online/api/cron/trends-ingest" \
              -H "x-cron-secret: ${CRON_SECRET}") || code=000
            echo "attempt $attempt: HTTP $code"
            if jq -e 'type == "object"' body.json >/dev/null 2>&1; then
              # The endpoint's own answer: show every run and every source not run.
              jq -r '(.runs // [])[] | "run \(.source)/\(.region): \(.status)\(if .reason then " — \(.reason)" else "" end) (fetched \(.fetched), inserted \(.inserted), matched \(.matched), review \(.review), deferred \(.deferred))"' body.json || true
              jq -r '(.notRun // [])[] | "not run \(.source): \(.status)\(if .reason then " — \(.reason)" else "" end)"' body.json || true
              jq -r 'select(.error) | "error: \(.error)"' body.json || true
              if [ "$code" = "200" ]; then exit 0; fi
              failed=$(jq -r '[(.runs // [])[] | select(.status == "error") | "\(.source)/\(.region): \(.reason // "unknown")"] | join("; ")' body.json 2>/dev/null || true)
              [ -n "$failed" ] || failed=$(jq -r '.error // "unknown"' body.json 2>/dev/null || echo unknown)
              echo "::error::trends-ingest answered HTTP $code — $failed"
              echo "summary=HTTP $code — $failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            # Not the endpoint's JSON: an edge or network failure worth retrying.
            head -c 300 body.json 2>/dev/null | tr -d '\r' || true
            echo
            if [ "$attempt" -ge 3 ]; then
              echo "::error::trends-ingest endpoint unreachable after $attempt attempts (last HTTP $code)"
              echo "summary=Endpoint unreachable after $attempt attempts (last HTTP $code)." >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "attempt $attempt failed; sleeping 30s"
            attempt=$((attempt + 1))
            sleep 30
          done

      - name: Report failure
        # One open issue for the failure, updated on each failed run, instead
        # of a new issue every six hours.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.ingest.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          title="cron trends ingest failed"
          body="The scheduled trends ingest failed: ${SUMMARY:-see the run log}. Open Trend Operations in the owner console for the failing source and its error. Run: ${RUN_URL}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
