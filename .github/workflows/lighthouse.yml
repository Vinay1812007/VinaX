# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: Lighthouse

# Runs Lighthouse against the prerendered static routes on every push to main
# (and on demand). Performance + best-practices are warn-only (GH Actions
# runners are noisy — real-world perf is measured by RUM instead). SEO +
# accessibility are hard-error since they're deterministic. Cloudflare Pages
# handles the real deploy separately and is not blocked by this.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build           # also runs the prerender step
      - run: npm install -g @lhci/cli@0.14.0
      - run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
