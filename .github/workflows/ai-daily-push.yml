# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: AI daily push

# Fires 5 times a day at IST hours the owner picked. Each fire calls the
# AI composer, which picks a slot-appropriate city + song, writes the
# copy, and delivers a location-targeted push. The endpoint hard-caps at
# one fire per 2h30m so a scheduler misfire can't spam subscribers —
# picked to survive normal Actions jitter without blocking the tight
# 13:00→16:00 IST and 21:00→24:00 IST 3-hour gaps.
#
# Slot mapping (IST = UTC+5:30):
#   02:30 UTC = 08:00 IST → morning boost
#   07:30 UTC = 13:00 IST → afternoon new release
#   10:30 UTC = 16:00 IST → afternoon pick-me-up
#   15:30 UTC = 21:00 IST → evening unwind
#   18:30 UTC = 00:00 IST (next day) → midnight quiet
on:
  schedule:
    - cron: '30 2,7,10,15,18 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Override slot: morning / afternoon / pickmeup / evening / midnight / trending'
        required: false
        type: string
      force:
        description: 'Bypass the 2h30m throttle (for testing)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trigger AI daily push
        # 3-attempt retry, 30 s backoff — same pattern as song-push.yml.
        # Response body is printed so cron logs show slot / target / song /
        # AI error (if any) at a glance without needing to open Cloudflare.
        run: |
          set -eu
          qs=""
          if [ -n "${{ inputs.slot }}" ]; then
            qs="?slot=${{ inputs.slot }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            qs="${qs:+$qs&}${qs:-?}force=1"
          fi
          attempt=1
          until curl --fail-with-body -sS -X POST \
              "https://www.sirimillavinay.online/api/cron/ai-daily-push${qs}" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" -w '\nHTTP %{http_code}\n'; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::ai-daily-push endpoint failed after $attempt attempts"
              exit 1
            fi
            echo "attempt $attempt failed; sleeping 30s"
            attempt=$((attempt + 1))
            sleep 30
          done

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "cron AI daily push failed" \
            --body "The scheduled AI daily push workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
