# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: Weekly digest
# Aggregates the week into the admin Overview digest card (Monday 09:00 IST).
on:
  schedule:
    - cron: '30 3 * * 1' # 03:30 UTC Monday = 09:00 IST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trigger digest endpoint
        # Audit finding L4: retry transient failures before giving up.
        run: |
          set -eu
          attempt=1
          until curl -fsS -X POST "https://www.sirimillavinay.online/api/cron/weekly-digest" \
              -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" | head -c 400; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::weekly-digest endpoint failed after $attempt attempts"
              exit 1
            fi
            echo "attempt $attempt failed; sleeping 30s"
            attempt=$((attempt + 1))
            sleep 30
          done

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "cron Weekly digest failed" \
            --body "The scheduled Weekly digest workflow failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
