# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Compute versionCode from a workflow-specific base to keep buildapk and
      # release.yml on disjoint ranges. release uses 1000000 + run_number so
      # tagged releases can never collide with buildapk's 1000+run_number
      # sequence (audit finding H-OPS-2).
      - name: Compute versionCode
        run: |
          BUILD_VERSION_CODE_BASE=1000000
          echo "BUILD_VERSION_CODE_BASE=$BUILD_VERSION_CODE_BASE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((BUILD_VERSION_CODE_BASE + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'

      - name: Install JS deps
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Build web bundle
        env:
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Patch Android project (Native Integration)
        run: node scripts/patch-android.js

      - name: Set versionCode + versionName + minSdk
        run: |
          BUILD=android/app/build.gradle
          VC=${VERSION_CODE:-1}
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]\+/versionCode $VC/" "$BUILD"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VN\"/" "$BUILD"

      - name: Grant gradlew permission
        run: chmod +x android/gradlew

      - name: Use a stable debug keystore (consistent app signature across builds)
        run: |
          mkdir -p ~/.android
          base64 -d ci/debug-keystore.b64 > ~/.android/debug.keystore

      - name: Detect keystore availability
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "HAS_KEYSTORE=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_ENV"

      # Audit finding C1: a tag build MUST be signed with the real release
      # keystore. If ANDROID_KEYSTORE_BASE64 is not configured we hard-fail
      # rather than fall back to a debug-signed APK — see H-OPS-1.
      - name: Require release keystore for tag builds
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is required for tag builds; refusing to publish a debug-signed release APK"
          exit 1

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Prepare release asset
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk vinax.apk
          sha256sum vinax.apk | awk '{print $1}' > vinax.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          name: VinaX ${{ github.ref_name }}
          make_latest: true
          files: |
            vinax.apk
            vinax.apk.sha256
          body: |
            Signed release APK for VinaX ${{ github.ref_name }}.
            Download and install on your Android device.
