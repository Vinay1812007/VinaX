# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: E2E

# Playwright suite (audit §6): the smoke script, then `playwright test` over
# frontend/e2e/ against the BUILT bundle (served by e2e/support/serve-dist.mjs)
# with all external network aborted. Deterministic by construction (no live
# catalog, no AI backend), so a red run means the app broke, not the internet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # @playwright/test and playwright-core are pinned to the same exact
      # version, so the locally installed CLI fetches the Chromium both expect.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      # HTML report with traces, screenshots and error context for each
      # failure: download it and run `npx playwright show-report <dir>`.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
