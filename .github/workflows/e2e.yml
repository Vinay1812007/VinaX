# Actions pinned by SHA — rotate via Dependabot (github-actions ecosystem).
name: E2E

# Playwright suite (audit §6): the smoke script, then `playwright test` over
# frontend/e2e/ against the BUILT bundle (served by e2e/support/serve-dist.mjs)
# with all external network aborted. Deterministic by construction (no live
# catalog, no live backend), so a red run means the app broke, not the internet.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # @playwright/test and playwright-core are pinned to the same exact
      # version, so the locally installed CLI fetches the Chromium both expect.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      # HTML report with traces, screenshots and error context for each
      # failure: download it and run `npx playwright show-report <dir>`.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
